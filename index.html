                  <li class="participant-item">
                    <div class="p-info">
                      <span class="p-color-dot" style="background:${PALETTE[idx % PALETTE.length]}; color:${PALETTE[idx % PALETTE.length]}"></span>
                      <span class="p-name">${p.name}</span>
                    </div>
                    <button class="p-remove" onclick="window.ruletaActions.removeParticipant('${p.id}')" aria-label="Eliminar ${p.name}" title="Eliminar">
                      ${Icons.x}
                    </button>
                  </li>
                `).join('') : `
                  <div class="empty-placeholder">
                    Aún no hay participantes en la ruleta.<br>Agrega nombres arriba, usa un preset o escanea el QR desde tu celular.
                  </div>
                `}
              </ul>

              <!-- Options / Checkboxes -->
              <div class="options-row">
                <label class="toggle-label">
                  <input type="checkbox" style="display:none;" ${state.removeWinnerAfterSpin ? 'checked' : ''} onchange="window.ruletaActions.toggleRemoveWinner(this.checked)" />
                  <div class="toggle-switch"></div>
                  <span>Eliminar ganador tras el giro</span>
                </label>

                ${state.participants.length ? `
                  <button class="btn-danger" style="background:none; border:none; font-size:12.5px; cursor:pointer; text-decoration:underline; padding:4px 8px;" onclick="window.ruletaActions.clearParticipants()">
                    Vaciar lista
                  </button>
                ` : ''}
              </div>
            </div>

            <!-- Winners History Panel -->
            <div class="glass-card winners-card" style="${state.winners.length ? '' : 'display:none;'}">
              <div class="panel-header">
                <div class="panel-title" style="color:var(--neon-yellow);">
                  ${Icons.trophy}
                  <span>Ganadores del Sorteo</span>
                  <span class="count-badge" style="background:rgba(255,208,0,0.15); color:var(--neon-yellow);">${state.winners.length}</span>
                </div>
                <button class="btn btn-glass btn-sm" onclick="window.ruletaActions.clearWinners()">
                  Limpiar
                </button>
              </div>
              <ul class="winners-list">
                ${state.winners.map((w, idx) => `
                  <li class="winner-entry">
                    <div class="winner-entry-left">
                      <span style="color:var(--neon-yellow);">${idx === 0 ? Icons.trophy : Icons.medal}</span>
                      <span class="winner-entry-name">${w.name}</span>
                    </div>
                    <span style="font-size:11.5px; opacity:0.8; flex-shrink:0;">${w.time}</span>
                  </li>
                `).join('')}
              </ul>
            </div>

          </div>
        </div>
      `;
    }

    function renderMobileScreen() {
      return `
        ${renderHeader()}

        <div class="mobile-view-wrap">
          
          <!-- Tab Navigation -->
          <div class="mobile-tabs">
            <button class="tab-btn ${state.mobileTab === 'remote' ? 'active' : ''}" onclick="window.ruletaActions.setMobileTab('remote')">
              ${Icons.gamepad} Control Remoto
            </button>
            <button class="tab-btn ${state.mobileTab === 'participants' ? 'active' : ''}" onclick="window.ruletaActions.setMobileTab('participants')">
              ${Icons.users} Participantes (${state.participants.length})
            </button>
          </div>

          ${state.mobileTab === 'remote' ? `
            <!-- Remote Control Tab -->
            <div class="glass-card remote-spin-box">
              <span style="font-size:12px; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.1em; font-weight:700;">
                Sorteo en Pantalla
              </span>

              <button class="remote-spin-btn" ${state.spinning || state.participants.length < 2 ? 'disabled' : ''} onclick="window.ruletaActions.spin()">
                <span>${state.spinning ? Icons.sparkles : Icons.play}</span>
                <span>${state.spinning ? 'GIRANDO' : '¡GIRAR!'}</span>
              </button>

              <div class="remote-status-text">
                ${state.spinning ? '¡La ruleta está girando en vivo!' : state.participants.length < 2 ? 'Agrega al menos 2 participantes' : `Listo para girar (${state.participants.length} en la ruleta)`}
              </div>

              <!-- Quick Single Add from Remote -->
              <form onsubmit="event.preventDefault(); window.ruletaActions.submitAddParticipant(this.quickName.value); this.reset();" class="input-row" style="width:100%; margin-top:20px;">
                <input type="text" name="quickName" class="input-styled" placeholder="Añade tu nombre a la ruleta..." autocomplete="off" />
                <button type="submit" class="btn btn-primary btn-sm">
                  ${Icons.plus}
                </button>
              </form>

              ${state.winners.length ? `
                <div style="margin-top:20px; width:100%; text-align:left;">
                  <span style="font-size:12px; color:var(--neon-yellow); font-weight:700; display:block; margin-bottom:8px;">Último Ganador:</span>
                  <div class="winner-entry">
                    <div class="winner-entry-left">
                      <span style="color:var(--neon-yellow);">${Icons.trophy}</span>
                      <span class="winner-entry-name">${state.winners[0].name}</span>
                    </div>
                    <span style="font-size:11.5px; opacity:0.8;">${state.winners[0].time}</span>
                  </div>
                </div>
              ` : ''}
            </div>
          ` : `
            <!-- Mobile Participants Management Tab -->
            <div class="glass-card">
              <div class="panel-header">
                <div class="panel-title">
                  ${Icons.users}
                  <span>Agregar a la Ruleta</span>
                </div>
                <button class="btn btn-glass btn-sm" onclick="window.ruletaActions.openBatchModal()">
                  ${Icons.paste} Pegar Lista
                </button>
              </div>

              <form onsubmit="event.preventDefault(); window.ruletaActions.submitAddParticipant(this.mobPName.value); this.reset();" class="input-row">
                <input type="text" name="mobPName" class="input-styled" placeholder="Escribe tu nombre..." autocomplete="off" autofocus />
                <button type="submit" class="btn btn-primary">
                  ${Icons.plus} Agregar
                </button>
              </form>

              <div class="panel-title" style="margin: 16px 0 10px; font-size:15px;">
                <span>En la Ruleta (${state.participants.length})</span>
              </div>

              <ul class="participants-list" style="max-height: 340px;">
                ${state.participants.length ? state.participants.map((p, idx) => `
                  <li class="participant-item">
                    <div class="p-info">
                      <span class="p-color-dot" style="background:${PALETTE[idx % PALETTE.length]}; color:${PALETTE[idx % PALETTE.length]}"></span>
                      <span class="p-name">${p.name}</span>
                    </div>
                    <button class="p-remove" onclick="window.ruletaActions.removeParticipant('${p.id}')" aria-label="Eliminar ${p.name}">
                      ${Icons.x}
                    </button>
                  </li>
                `).join('') : `
                  <div class="empty-placeholder">
                    No hay participantes aún.<br>Sé el primero en agregar tu nombre.
                  </div>
                `}
              </ul>
            </div>
          `}
        </div>
      `;
    }

    function renderWinnerModal() {
      if (!state.winnerModal) return '';
      return `
        <div class="modal-overlay" onclick="if(event.target === this) window.ruletaActions.closeWinnerModal()">
          <div class="modal-card">
            <div class="trophy-badge">
              <span style="font-size:36px; display:flex;">${Icons.trophy}</span>
            </div>
            <div class="winner-title">¡Tenemos un Ganador!</div>
            <div class="winner-name-highlight">${state.winnerModal.name}</div>
            
            <div style="display:flex; flex-direction:column; gap:10px;">
              <button class="btn btn-gold" style="width:100%; font-size:16px;" onclick="window.ruletaActions.closeWinnerModal()">
                ${Icons.play} ¡Continuar / Siguiente Giro!
              </button>
              <button class="btn btn-glass" style="width:100%; font-size:14px;" onclick="window.ruletaActions.copyWinnerName('${state.winnerModal.name}')">
                ${Icons.copy} Copiar Nombre
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function renderBatchModal() {
      if (!state.batchModalOpen) return '';
      return `
        <div class="modal-overlay" onclick="if(event.target === this) window.ruletaActions.closeBatchModal()">
          <div class="modal-card" style="text-align:left;">
            <div class="panel-title" style="margin-bottom:10px;">
              ${Icons.paste}
              <span>Pegar Lista de Participantes</span>
            </div>
            <p style="font-size:13px; color:var(--text-muted); margin-bottom:14px;">
              Pega nombres separados por saltos de línea, comas o directamente desde Excel y WhatsApp.
            </p>
            <textarea id="batchTextInput" class="textarea-styled" placeholder="Ana García&#10;Carlos López&#10;María Rodríguez&#10;Juan Pablo..."></textarea>
            <div style="display:flex; justify-content:flex-end; gap:10px;">
              <button class="btn btn-glass" onclick="window.ruletaActions.closeBatchModal()">Cancelar</button>
              <button class="btn btn-primary" onclick="window.ruletaActions.submitBatch(document.getElementById('batchTextInput').value)">
                ${Icons.check} Importar Lista
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function renderQRModal() {
      if (!state.qrModalOpen) return '';
      const mobileUrl = getMobileUrl(state.roomCode);
      const qrApiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=280x280&margin=8&data=${encodeURIComponent(mobileUrl)}`;

      return `
        <div class="modal-overlay" onclick="if(event.target === this) window.ruletaActions.toggleQRModal()">
          <div class="modal-card">
            <h3 class="panel-title" style="justify-content:center; margin-bottom:6px; font-size:20px;">
              ${Icons.smartphone}
              <span>Conectar Teléfono Celular</span>
            </h3>
            <p style="font-size:13px; color:var(--text-muted); margin-bottom:14px;">
              Abre la cámara de tu celular para conectarte a la ruleta:
            </p>
            <div style="background:white; padding:12px; border-radius:16px; display:inline-block; margin-bottom:14px;">
              <img src="${qrApiUrl}" style="width:200px; height:200px; display:block;" alt="Código QR" />
            </div>
            
            <div style="background:rgba(255,255,255,0.06); padding:10px; border-radius:10px; margin-bottom:14px; border:1px solid var(--card-border);">
              <span style="font-size:12px; color:var(--text-muted); display:block; margin-bottom:2px;">Enlace directo:</span>
              <span style="font-size:13.5px; font-weight:700; color:var(--neon-cyan); word-break:break-all;">${mobileUrl}</span>
            </div>

            <div style="margin-bottom:18px;">
              <span style="font-size:12px; color:var(--text-muted); display:block;">Código de Sala:</span>
              <span class="room-code-display" style="font-size:36px;">${state.roomCode}</span>
            </div>
            <div style="display:flex; gap:10px;">
              <button class="btn btn-glass" style="flex:1;" onclick="window.ruletaActions.copyRoomLink('${mobileUrl}')">
                ${Icons.copy} Copiar Enlace
              </button>
              <button class="btn btn-primary" style="flex:1;" onclick="window.ruletaActions.toggleQRModal()">
                Cerrar
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function triggerRender() {
      let content = '';
      if (state.view === 'select') {
        content = renderSelectScreen();
      } else if (state.view === 'host') {
        content = renderHostScreen();
      } else if (state.view === 'mobile') {
        content = renderMobileScreen();
      }

      content += renderWinnerModal();
      content += renderBatchModal();
      content += renderQRModal();

      appEl.innerHTML = content;

      if (state.view === 'host') {
        requestAnimationFrame(drawWheel);
      }
    }

    // --- Global Actions for Event Binding ---
    window.ruletaActions = {
      setRole: (role) => {
        state.view = role;
        audio.playClick();
        triggerRender();
      },

      startHost: () => {
        if (!state.roomCode) state.roomCode = generateRoomCode();
        state.view = 'host';
        initSync(state.roomCode, 'host');
        audio.playClick();
        triggerRender();
      },

      startDirectPlay: () => {
        state.roomCode = '';
        state.view = 'host';
        audio.playClick();
        triggerRender();
      },

      startMobile: () => {
        const urlParams = new URLSearchParams(window.location.search);
        let room = urlParams.get('room');
        if (!room) {
          room = prompt('Ingresa el Código de Sala (ej: 7842):', state.roomCode || '');
        }
        if (room && room.trim()) {
          state.roomCode = room.trim();
          state.view = 'mobile';
          initSync(state.roomCode, 'mobile');
          audio.playClick();
          triggerRender();
        }
      },

      setMobileTab: (tab) => {
        state.mobileTab = tab;
        audio.playClick();
        triggerRender();
      },

      setMobileStageTab: (tab) => {
        state.mobileStageTab = tab;
        audio.playClick();
        triggerRender();
        if (tab === 'ruleta') {
          setTimeout(drawWheel, 60);
        }
      },

      toggleAudio: () => {
        audio.toggleMute();
        triggerRender();
      },

      toggleQRCard: () => {
        state.showQRCard = !state.showQRCard;
        audio.playClick();
        triggerRender();
        if (state.view === 'host') {
          setTimeout(drawWheel, 60);
        }
      },

      toggleExpandStage: () => {
        state.expandedStage = !state.expandedStage;
        if (state.expandedStage) {
          if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(() => {});
          }
        } else {
          if (document.fullscreenElement) {
            document.exitFullscreen().catch(() => {});
          }
        }
        audio.playClick();
        triggerRender();
        setTimeout(drawWheel, 80);
      },

      toggleQRModal: () => {
        state.qrModalOpen = !state.qrModalOpen;
        audio.playClick();
        triggerRender();
      },

      copyRoomLink: (url) => {
        if (navigator.clipboard) {
          navigator.clipboard.writeText(url);
          showToast(`${Icons.check} Enlace copiado al portapapeles`);
        }
      },

      copyWinnerName: (name) => {
        if (navigator.clipboard) {
          navigator.clipboard.writeText(name);
          showToast(`${Icons.check} Nombre copiado: ${name}`);
        }
      },

      openBatchModal: () => {
        state.batchModalOpen = true;
        audio.playClick();
        triggerRender();
      },

      closeBatchModal: () => {
        state.batchModalOpen = false;
        triggerRender();
      },

      submitBatch: (text) => {
        parseBatchText(text);
      },

      loadPreset: (type) => {
        loadPreset(type);
      },

      shuffleParticipants: () => {
        shuffleParticipants();
      },

      submitAddParticipant: (name) => {
        addSingleParticipant(name);
      },

      removeParticipant: (id) => {
        removeParticipant(id);
      },

      clearParticipants: () => {
        if (confirm('¿Deseas vaciar la lista de participantes?')) {
          state.participants = [];
          if (state.sync) {
            state.sync.send('STATE_SYNC_RESPONSE', {
              participants: [],
              winners: state.winners,
              removeWinnerAfterSpin: state.removeWinnerAfterSpin
            });
          }
          triggerRender();
        }
      },

      clearWinners: () => {
        state.winners = [];
        triggerRender();
      },

      toggleRemoveWinner: (checked) => {
        state.removeWinnerAfterSpin = checked;
        if (state.sync) {
          state.sync.send('STATE_SYNC_RESPONSE', {
            participants: state.participants,
            winners: state.winners,
            removeWinnerAfterSpin: state.removeWinnerAfterSpin
          });
        }
      },

      spin: () => {
        if (state.view === 'mobile') {
          if (state.spinning || state.participants.length < 2) return;
          state.spinning = true;
          audio.playClick();
          triggerRender();
          if (state.sync) {
            state.sync.send('TRIGGER_SPIN', {});
          }
        } else {
          executeSpin();
        }
      },

      closeWinnerModal: () => {
        state.winnerModal = null;
        triggerRender();
      }
    };

    // --- Window Listeners for Canvas Responsiveness ---
    window.addEventListener('resize', () => {
      if (state.view === 'host') {
        drawWheel();
      }
    });

    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement && state.expandedStage) {
        state.expandedStage = false;
        triggerRender();
      }
      if (state.view === 'host') {
        setTimeout(drawWheel, 100);
      }
    });

    // --- URL Query Parameter Auto-Join Detection ---
    async function checkUrlAutoJoin() {
      await fetchServerInfo();

      const urlParams = new URLSearchParams(window.location.search);
      const roomParam = urlParams.get('room');
      const modeParam = urlParams.get('mode');

      if (roomParam) {
        state.roomCode = roomParam.trim();
        const role = (modeParam === 'mobile' || /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent)) ? 'mobile' : 'host';
        state.view = role;
        initSync(state.roomCode, role);
      }
      triggerRender();
    }

    // Initialize App
    checkUrlAutoJoin();

  })();
  </script>
</body>
</html>
