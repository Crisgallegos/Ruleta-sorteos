<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Work+Sans:wght@400;500;600;700&display=swap');

  #ruleta-root {
    --bg: #12302B;
    --bg-soft: #1B4139;
    --card: #1D453D;
    --gold: #F0B429;
    --coral: #E2543D;
    --cream: #FBF4E4;
    --ink: #0C201C;
    --line: rgba(251,244,228,0.14);
    font-family: 'Work Sans', sans-serif;
    color: var(--cream);
    background: var(--bg);
    background-image:
      radial-gradient(circle at 15% 10%, rgba(240,180,41,0.10), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(226,84,61,0.10), transparent 40%);
    min-height: 100%;
    width: 100%;
    box-sizing: border-box;
    padding: 28px 18px 40px;
    display: flex;
    justify-content: center;
  }
  #ruleta-root *, #ruleta-root *::before, #ruleta-root *::after { box-sizing: border-box; }

  .r-shell { width: 100%; max-width: 880px; }

  .r-display { font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.02em; }

  /* ---- role select ---- */
  .r-hero { text-align: center; margin-bottom: 34px; }
  .r-hero h1 { font-size: clamp(40px, 8vw, 60px); margin: 0 0 6px; line-height: 0.95; }
  .r-hero p { margin: 0; opacity: 0.72; font-size: 15px; }

  .r-role-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 560px) { .r-role-grid { grid-template-columns: 1fr; } }

  .r-role-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 26px 22px;
    text-align: left;
    cursor: pointer;
    color: var(--cream);
    transition: border-color 0.15s ease, transform 0.15s ease;
    font-family: inherit;
  }
  .r-role-card:hover { border-color: var(--gold); transform: translateY(-2px); }
  .r-role-card .r-role-icon { font-size: 28px; display: block; margin-bottom: 14px; }
  .r-role-card h3 { font-family: 'Bebas Neue', sans-serif; font-size: 26px; margin: 0 0 6px; letter-spacing: 0.02em; }
  .r-role-card p { margin: 0; font-size: 13.5px; opacity: 0.68; line-height: 1.45; }

  /* ---- shared bits ---- */
  .r-back {
    background: none; border: none; color: var(--cream); opacity: 0.6;
    font-size: 13px; cursor: pointer; padding: 6px 0; margin-bottom: 18px;
    font-family: inherit; display: inline-flex; align-items: center; gap: 6px;
  }
  .r-back:hover { opacity: 1; }

  .r-field-label { font-size: 12.5px; opacity: 0.65; margin-bottom: 7px; display: block; }
  .r-input {
    width: 100%; background: var(--bg-soft); border: 1px solid var(--line);
    color: var(--cream); border-radius: 10px; padding: 14px 16px; font-size: 16px;
    font-family: inherit; outline: none; transition: border-color 0.15s ease;
  }
  .r-input:focus { border-color: var(--gold); }
  .r-input::placeholder { color: rgba(251,244,228,0.35); }

  .r-btn {
    font-family: 'Work Sans', sans-serif; font-weight: 600; font-size: 15px;
    border: none; border-radius: 10px; padding: 14px 22px; cursor: pointer;
    transition: filter 0.15s ease, transform 0.1s ease;
  }
  .r-btn:active { transform: scale(0.98); }
  .r-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .r-btn-primary { background: var(--gold); color: var(--ink); }
  .r-btn-primary:hover:not(:disabled) { filter: brightness(1.08); }
  .r-btn-ghost { background: transparent; color: var(--cream); border: 1px solid var(--line); }
  .r-btn-ghost:hover:not(:disabled) { border-color: var(--gold); }

  /* ---- participant screen ---- */
  .r-participant-wrap { max-width: 420px; margin: 8vh auto 0; text-align: center; }
  .r-participant-wrap .r-display { font-size: 34px; margin-bottom: 4px; }
  .r-participant-sub { opacity: 0.65; font-size: 13.5px; margin-bottom: 26px; }
  .r-join-code-row { text-align: left; margin-bottom: 18px; }
  .r-big-input {
    width: 100%; background: var(--bg-soft); border: 2px solid var(--line);
    color: var(--cream); border-radius: 14px; padding: 22px 18px; font-size: 22px;
    font-family: inherit; text-align: center; outline: none; margin-bottom: 16px;
  }
  .r-big-input:focus { border-color: var(--gold); }
  .r-participant-status { font-size: 13px; margin-top: 14px; min-height: 18px; }
  .r-status-ok { color: var(--gold); }
  .r-status-err { color: var(--coral); }
  .r-joined-badge {
    display: inline-block; background: rgba(240,180,41,0.12); border: 1px solid var(--gold);
    color: var(--gold); font-size: 12.5px; padding: 6px 14px; border-radius: 999px; margin-bottom: 22px;
  }
  .r-change-room { background: none; border: none; color: var(--cream); opacity: 0.5; font-size: 12px; text-decoration: underline; cursor: pointer; margin-top: 16px; font-family: inherit; }

  /* ---- host screen ---- */
  .r-host-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; flex-wrap: wrap; margin-bottom: 22px; }
  .r-code-box { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px 22px; }
  .r-code-box .r-field-label { margin-bottom: 4px; }
  .r-code-box .r-code-value { font-family: 'Bebas Neue', sans-serif; font-size: 34px; letter-spacing: 0.12em; color: var(--gold); }
  .r-qr { border-radius: 10px; margin-top: 10px; display: block; }

  .r-setup-wrap { max-width: 460px; margin: 6vh auto 0; text-align: center; }
  .r-setup-wrap .r-display { font-size: 34px; margin-bottom: 8px; }
  .r-setup-wrap p { opacity: 0.65; font-size: 14px; margin-bottom: 26px; }

  .r-host-grid { display: grid; grid-template-columns: 1.3fr 1fr; gap: 26px; align-items: start; }
  @media (max-width: 760px) { .r-host-grid { grid-template-columns: 1fr; } }

  .r-wheel-area { display: flex; flex-direction: column; align-items: center; }
  .r-wheel-frame { position: relative; width: min(100%, 380px); aspect-ratio: 1; margin: 6px auto 22px; }
  .r-pointer {
    position: absolute; top: -6px; left: 50%; transform: translateX(-50%); z-index: 3;
    width: 0; height: 0; border-left: 14px solid transparent; border-right: 14px solid transparent;
    border-top: 24px solid var(--coral); filter: drop-shadow(0 2px 3px rgba(0,0,0,0.35));
  }
  .r-wheel-hub {
    position: absolute; top: 50%; left: 50%; width: 15%; height: 15%; transform: translate(-50%,-50%);
    background: var(--cream); border-radius: 50%; z-index: 2; box-shadow: 0 0 0 4px var(--bg), 0 2px 8px rgba(0,0,0,0.4);
  }
  .r-wheel-svg { width: 100%; height: 100%; display: block; }
  .r-wheel-g { transform-origin: 50% 50%; }

  .r-spin-btn {
    font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 0.05em;
    background: var(--coral); color: var(--cream); border: none; border-radius: 999px;
    padding: 15px 46px; cursor: pointer; transition: filter 0.15s ease, transform 0.1s ease;
  }
  .r-spin-btn:hover:not(:disabled) { filter: brightness(1.1); }
  .r-spin-btn:active:not(:disabled) { transform: scale(0.97); }
  .r-spin-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .r-empty-note { opacity: 0.55; font-size: 13px; margin-top: 10px; text-align: center; }

  .r-panel { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px 20px 22px; }
  .r-panel + .r-panel { margin-top: 16px; }
  .r-panel-title { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .r-panel-title h3 { font-family: 'Bebas Neue', sans-serif; font-size: 19px; margin: 0; letter-spacing: 0.03em; }
  .r-count-pill { background: var(--bg-soft); font-size: 12px; padding: 3px 10px; border-radius: 999px; opacity: 0.8; }
  .r-refresh { background: none; border: none; color: var(--gold); font-size: 12px; cursor: pointer; opacity: 0.75; font-family: inherit; }
  .r-refresh:hover { opacity: 1; }

  .r-add-row { display: flex; gap: 8px; margin-bottom: 14px; }
  .r-add-row .r-input { padding: 10px 12px; font-size: 14px; }
  .r-add-row .r-btn { padding: 10px 16px; font-size: 13px; flex-shrink: 0; }

  .r-plist { list-style: none; margin: 0; padding: 0; max-height: 260px; overflow-y: auto; }
  .r-plist li {
    display: flex; align-items: center; justify-content: space-between;
    padding: 9px 4px; border-bottom: 1px solid var(--line); font-size: 14.5px;
  }
  .r-plist li:last-child { border-bottom: none; }
  .r-plist .r-dot { width: 9px; height: 9px; border-radius: 50%; margin-right: 10px; flex-shrink: 0; display: inline-block; }
  .r-plist .r-pname { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .r-remove-x { background: none; border: none; color: var(--cream); opacity: 0.35; cursor: pointer; font-size: 15px; padding: 2px 6px; font-family: inherit; }
  .r-remove-x:hover { opacity: 1; color: var(--coral); }
  .r-empty-list { opacity: 0.5; font-size: 13px; padding: 10px 4px; }

  .r-winners li { opacity: 0.85; }
  .r-winners .r-wtrophy { margin-right: 8px; }

  /* ---- winner modal ---- */
  .r-modal-overlay {
    position: fixed; inset: 0; background: rgba(12,32,28,0.82); backdrop-filter: blur(3px);
    display: flex; align-items: center; justify-content: center; z-index: 50; padding: 20px;
  }
  .r-modal {
    background: var(--card); border: 1px solid var(--gold); border-radius: 18px;
    padding: 40px 36px; text-align: center; max-width: 360px; width: 100%;
    animation: r-pop 0.35s cubic-bezier(.2,1.4,.4,1);
  }
  @keyframes r-pop { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .r-modal-eyebrow { font-size: 12.5px; opacity: 0.6; margin-bottom: 8px; }
  .r-modal-name { font-family: 'Bebas Neue', sans-serif; font-size: 40px; color: var(--gold); line-height: 1.05; margin-bottom: 22px; word-break: break-word; }
  .r-confetti { position: absolute; inset: 0; overflow: hidden; pointer-events: none; border-radius: 18px; }
  .r-confetti span {
    position: absolute; top: -10%; width: 8px; height: 14px; opacity: 0.9;
    animation: r-fall 1.8s ease-in forwards;
  }
  @keyframes r-fall { to { transform: translateY(420px) rotate(220deg); opacity: 0; } }

  @media (prefers-reduced-motion: reduce) {
    .r-wheel-g { transition: none !important; }
    .r-modal { animation: none; }
    .r-confetti span { animation: none; display: none; }
  }
</style>

<div id="ruleta-root"></div>

<script>
(function () {
  const root = document.getElementById('ruleta-root');

  const WHEEL_COLORS = ['#E2543D', '#F0B429', '#3E7C6C', '#F2D9A8', '#B8402C', '#2C5A4E'];

  const state = {
    screen: 'select',        // select | host-setup | host-live | participant
    code: '',
    participants: [],        // [{id, name}]
    winners: [],              // [name]
    joinCodeInput: '',
    joinNameInput: '',
    joined: false,
    joinStatus: null,         // {type:'ok'|'err', msg}
    spinning: false,
    winnerModal: null,        // name currently shown
    pollHandle: null,
    lastKeys: new Set()
  };

  function el(tag, props, children) {
    const e = document.createElement(tag);
    if (props) Object.keys(props).forEach(k => {
      const v = props[k];
      if (v === null || v === undefined) return;
      if (k === 'class') e.className = v;
      else if (k === 'html') e.innerHTML = v;
      else if (k.startsWith('on')) e.addEventListener(k.slice(2).toLowerCase(), v);
      else e.setAttribute(k, v);
    });
    (children || []).forEach(c => { if (c) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return e;
  }

  function genCode() {
    return String(Math.floor(1000 + Math.random() * 9000));
  }

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // ---------- storage helpers ----------
  async function storageSet(key, value) {
    try { await window.storage.set(key, value, true); return true; }
    catch (e) { console.error('storage.set failed', e); return false; }
  }
  async function storageDelete(key) {
    try { await window.storage.delete(key, true); return true; }
    catch (e) { console.error('storage.delete failed', e); return false; }
  }
  async function storageList(prefix) {
    try { const r = await window.storage.list(prefix, true); return (r && r.keys) || []; }
    catch (e) { return []; }
  }
  async function storageGet(key) {
    try { const r = await window.storage.get(key, true); return r ? r.value : null; }
    catch (e) { return null; }
  }

  async function addParticipant(code, name) {
    const clean = name.trim();
    if (!clean) return false;
    const key = `rt:${code}:p:${Date.now()}_${Math.random().toString(36).slice(2, 7)}`;
    return await storageSet(key, JSON.stringify({ name: clean }));
  }

  async function pollParticipants() {
    if (!state.code) return;
    const keys = await storageList(`rt:${state.code}:p:`);
    const newKeys = keys.filter(k => !state.lastKeys.has(k));
    for (const k of newKeys) {
      const val = await storageGet(k);
      if (val) {
        try {
          const parsed = JSON.parse(val);
          state.participants.push({ id: k, name: parsed.name });
          state.lastKeys.add(k);
        } catch (e) {}
      }
    }
    // drop any participants whose keys no longer exist (removed elsewhere)
    const keySet = new Set(keys);
    state.participants = state.participants.filter(p => keySet.has(p.id));
    state.lastKeys = new Set(state.participants.map(p => p.id));
    if (newKeys.length) render();
  }

  function startPolling() {
    stopPolling();
    state.pollHandle = setInterval(pollParticipants, 3500);
  }
  function stopPolling() {
    if (state.pollHandle) clearInterval(state.pollHandle);
    state.pollHandle = null;
  }

  // ---------- wheel geometry ----------
  function polar(cx, cy, r, angleDeg) {
    const t = (angleDeg * Math.PI) / 180;
    return { x: cx + r * Math.sin(t), y: cy - r * Math.cos(t) };
  }

  function buildWheelSVG(participants) {
    const size = 320, cx = size / 2, cy = size / 2, r = size / 2 - 6;
    const n = participants.length;
    const ns = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(ns, 'svg');
    svg.setAttribute('viewBox', `0 0 ${size} ${size}`);
    svg.setAttribute('class', 'r-wheel-svg');
    const g = document.createElementNS(ns, 'g');
    g.setAttribute('class', 'r-wheel-g');

    if (n === 0) {
      const circle = document.createElementNS(ns, 'circle');
      circle.setAttribute('cx', cx); circle.setAttribute('cy', cy); circle.setAttribute('r', r);
      circle.setAttribute('fill', '#1B4139');
      g.appendChild(circle);
    } else {
      const slice = 360 / n;
      participants.forEach((p, i) => {
        const a0 = i * slice, a1 = (i + 1) * slice;
        const p0 = polar(cx, cy, r, a0), p1 = polar(cx, cy, r, a1);
        const large = (a1 - a0) > 180 ? 1 : 0;
        const path = document.createElementNS(ns, 'path');
        path.setAttribute('d', `M ${cx} ${cy} L ${p0.x} ${p0.y} A ${r} ${r} 0 ${large} 1 ${p1.x} ${p1.y} Z`);
        path.setAttribute('fill', WHEEL_COLORS[i % WHEEL_COLORS.length]);
        path.setAttribute('stroke', '#12302B');
        path.setAttribute('stroke-width', '1.5');
        g.appendChild(path);

        const mid = a0 + slice / 2;
        const lp = polar(cx, cy, r * 0.62, mid);
        const text = document.createElementNS(ns, 'text');
        text.setAttribute('x', lp.x); text.setAttribute('y', lp.y);
        text.setAttribute('fill', '#FBF4E4');
        text.setAttribute('font-size', n > 14 ? '9' : n > 8 ? '11' : '13');
        text.setAttribute('font-family', 'Work Sans, sans-serif');
        text.setAttribute('font-weight', '600');
        text.setAttribute('text-anchor', 'middle');
        text.setAttribute('dominant-baseline', 'middle');
        text.setAttribute('transform', `rotate(${mid}, ${lp.x}, ${lp.y})`);
        let label = p.name;
        if (label.length > 14) label = label.slice(0, 13) + '…';
        text.textContent = label;
        g.appendChild(text);
      });
    }
    svg.appendChild(g);
    return { svg, g };
  }

  // ---------- spin logic ----------
  function spin() {
    if (state.spinning || state.participants.length < 2) return;
    state.spinning = true;
    stopPolling();
    render();

    const wheelG = root.querySelector('.r-wheel-g');
    if (!wheelG) { state.spinning = false; return; }

    const n = state.participants.length;
    const slice = 360 / n;
    const winnerIndex = Math.floor(Math.random() * n);
    const winner = state.participants[winnerIndex];

    const targetMid = winnerIndex * slice + slice / 2;
    const jitter = (Math.random() - 0.5) * slice * 0.6;
    const extraSpins = 5 + Math.floor(Math.random() * 3);
    const finalRotation = extraSpins * 360 + (360 - targetMid) + jitter;

    wheelG.style.transition = 'none';
    wheelG.style.transform = 'rotate(0deg)';
    // force reflow so the reset takes effect before animating
    void wheelG.getBoundingClientRect();
    wheelG.style.transition = 'transform 4.2s cubic-bezier(0.15, 0.65, 0.15, 1)';
    wheelG.style.transform = `rotate(${finalRotation}deg)`;

    const onEnd = async () => {
      wheelG.removeEventListener('transitionend', onEnd);
      await storageDelete(winner.id);
      state.participants = state.participants.filter(p => p.id !== winner.id);
      state.lastKeys.delete(winner.id);
      state.winners.unshift(winner.name);
      state.spinning = false;
      state.winnerModal = winner.name;
      render();
    };
    wheelG.addEventListener('transitionend', onEnd);
  }

  function closeWinnerModal() {
    state.winnerModal = null;
    state.participants = shuffle(state.participants);
    render();
    startPolling();
  }

  // ---------- screens ----------
  function renderSelectScreen() {
    const wrap = el('div', { class: 'r-shell' }, [
      el('div', { class: 'r-hero' }, [
        el('h1', { class: 'r-display' }, ['La Ruleta']),
        el('p', {}, ['Elige cómo quieres participar'])
      ]),
      el('div', { class: 'r-role-grid' }, [
        el('button', { class: 'r-role-card', onclick: () => { state.screen = 'host-setup'; render(); } }, [
          el('span', { class: 'r-role-icon' }, ['🖥️']),
          el('h3', {}, ['Soy anfitrión']),
          el('p', {}, ['Crea la sala, muestra la ruleta y gira desde tu computador.'])
        ]),
        el('button', { class: 'r-role-card', onclick: () => { state.screen = 'participant'; render(); } }, [
          el('span', { class: 'r-role-icon' }, ['📱']),
          el('h3', {}, ['Soy participante']),
          el('p', {}, ['Únete a una sala desde tu teléfono con el código del anfitrión.'])
        ])
      ])
    ]);
    root.appendChild(wrap);
  }

  function renderHostSetup() {
    if (!state.code) state.code = genCode();
    const wrap = el('div', { class: 'r-shell' }, [
      el('button', { class: 'r-back', onclick: () => { state.screen = 'select'; state.code = ''; render(); } }, ['← Volver']),
      el('div', { class: 'r-setup-wrap' }, [
        el('h2', { class: 'r-display' }, ['Crear sala']),
        el('p', {}, ['Este es el código que compartirás con los participantes.']),
        el('div', { class: 'r-code-box', style: 'display:inline-block; margin-bottom:26px;' }, [
          el('span', { class: 'r-field-label' }, ['Código de sala']),
          el('div', { class: 'r-code-value' }, [state.code])
        ]),
        el('div', {}, [
          el('button', {
            class: 'r-btn r-btn-primary', style: 'width:100%; font-size:16px;',
            onclick: () => { state.screen = 'host-live'; render(); startPolling(); pollParticipants(); }
          }, ['Iniciar sala'])
        ])
      ])
    ]);
    root.appendChild(wrap);
  }

  function renderHostLive() {
    const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=180x180&margin=8&data=${state.code}`;

    const top = el('div', { class: 'r-host-top' }, [
      el('div', {}, [
        el('h1', { class: 'r-display', style: 'font-size:30px; margin:0 0 2px;' }, ['La Ruleta']),
        el('p', { style: 'opacity:0.6; font-size:13px; margin:0;' }, ['Sala en vivo'])
      ]),
      el('div', { class: 'r-code-box' }, [
        el('span', { class: 'r-field-label' }, ['Código para unirse']),
        el('div', { class: 'r-code-value' }, [state.code]),
        el('img', { class: 'r-qr', src: qrUrl, width: '96', height: '96', alt: `Código QR ${state.code}`, onerror: function () { this.style.display = 'none'; } })
      ])
    ]);

    const wheelWrap = buildWheelSVG(state.participants);
    const wheelFrame = el('div', { class: 'r-wheel-frame' }, [
      el('div', { class: 'r-pointer' }),
      el('div', { class: 'r-wheel-hub' }),
      wheelWrap.svg
    ]);

    const canSpin = state.participants.length >= 2 && !state.spinning;
    const wheelArea = el('div', { class: 'r-wheel-area' }, [
      wheelFrame,
      el('button', { class: 'r-spin-btn', disabled: canSpin ? null : 'disabled', onclick: spin }, [state.spinning ? 'Girando…' : 'Girar']),
      state.participants.length < 2
        ? el('p', { class: 'r-empty-note' }, ['Se necesitan al menos 2 participantes para girar.'])
        : null
    ]);

    let nameInputVal = '';
    const addInput = el('input', { class: 'r-input', placeholder: 'Agregar participante…', oninput: e => nameInputVal = e.target.value });
    const doAdd = async () => {
      if (!nameInputVal.trim()) return;
      await addParticipant(state.code, nameInputVal);
      addInput.value = '';
      pollParticipants();
    };
    addInput.addEventListener('keydown', e => { if (e.key === 'Enter') doAdd(); });

    const plist = el('ul', { class: 'r-plist' },
      state.participants.length
        ? state.participants.map((p, i) => el('li', {}, [
            el('span', { style: 'display:flex; align-items:center; overflow:hidden;' }, [
              el('span', { class: 'r-dot', style: `background:${WHEEL_COLORS[i % WHEEL_COLORS.length]}` }),
              el('span', { class: 'r-pname' }, [p.name])
            ]),
            el('button', {
              class: 'r-remove-x', title: 'Quitar',
              onclick: async () => { await storageDelete(p.id); state.lastKeys.delete(p.id); state.participants = state.participants.filter(x => x.id !== p.id); render(); }
            }, ['✕'])
          ]))
        : [el('li', { class: 'r-empty-list' }, ['Aún no hay participantes. Comparte el código o agrégalos aquí.'])]
    );

    const participantsPanel = el('div', { class: 'r-panel' }, [
      el('div', { class: 'r-panel-title' }, [
        el('h3', {}, ['Participantes']),
        el('span', { class: 'r-count-pill' }, [String(state.participants.length)])
      ]),
      el('div', { class: 'r-add-row' }, [
        addInput,
        el('button', { class: 'r-btn r-btn-primary', onclick: doAdd }, ['Agregar'])
      ]),
      plist,
      el('button', { class: 'r-refresh', style: 'margin-top:10px;', onclick: pollParticipants }, ['↻ Actualizar ahora'])
    ]);

    const winnersPanel = state.winners.length ? el('div', { class: 'r-panel r-winners' }, [
      el('div', { class: 'r-panel-title' }, [ el('h3', {}, ['Ganadores']) ]),
      el('ul', { class: 'r-plist' }, state.winners.map(w => el('li', {}, [
        el('span', {}, [ el('span', { class: 'r-wtrophy' }, ['🏆']), w ])
      ])))
    ]) : null;

    const grid = el('div', { class: 'r-host-grid' }, [
      wheelArea,
      el('div', {}, [participantsPanel, winnersPanel])
    ]);

    const wrap = el('div', { class: 'r-shell' }, [top, grid]);
    root.appendChild(wrap);

    if (state.winnerModal) {
      root.appendChild(renderWinnerModal(state.winnerModal));
    }
  }

  function renderWinnerModal(name) {
    const confettiSpans = [];
    for (let i = 0; i < 24; i++) {
      const color = WHEEL_COLORS[i % WHEEL_COLORS.length];
      const left = Math.random() * 100;
      const delay = Math.random() * 0.4;
      const dur = 1.4 + Math.random() * 0.8;
      confettiSpans.push(el('span', { style: `left:${left}%; background:${color}; animation-delay:${delay}s; animation-duration:${dur}s;` }));
    }
    const overlay = el('div', { class: 'r-modal-overlay', onclick: (e) => { if (e.target === overlay) closeWinnerModal(); } }, [
      el('div', { class: 'r-modal', style: 'position:relative;' }, [
        el('div', { class: 'r-confetti' }, confettiSpans),
        el('div', { class: 'r-modal-eyebrow' }, ['El ganador es']),
        el('div', { class: 'r-modal-name' }, [name]),
        el('button', { class: 'r-btn r-btn-primary', style: 'width:100%;', onclick: closeWinnerModal }, ['Continuar'])
      ])
    ]);
    return overlay;
  }

  function renderParticipant() {
    const wrap = el('div', { class: 'r-shell' }, [
      el('button', { class: 'r-back', onclick: () => { stopSelfPoll(); state.screen = 'select'; state.joined = false; state.joinCodeInput = ''; state.joinNameInput = ''; state.joinStatus = null; render(); } }, ['← Volver']),
      el('div', { class: 'r-participant-wrap' })
    ]);
    const inner = wrap.querySelector('.r-participant-wrap');

    if (!state.joined) {
      const codeInput = el('input', {
        class: 'r-input', placeholder: 'Ej: 4821', inputmode: 'numeric', value: state.joinCodeInput,
        oninput: e => state.joinCodeInput = e.target.value
      });
      const nameInput = el('input', {
        class: 'r-big-input', placeholder: 'Ingresa usuario', value: state.joinNameInput,
        oninput: e => state.joinNameInput = e.target.value
      });
      const submit = async () => {
        const code = state.joinCodeInput.trim();
        const name = state.joinNameInput.trim();
        if (!code) { state.joinStatus = { type: 'err', msg: 'Ingresa el código de sala.' }; render(); return; }
        if (!name) { state.joinStatus = { type: 'err', msg: 'Ingresa tu usuario.' }; render(); return; }
        const ok = await addParticipant(code, name);
        if (ok) {
          state.code = code;
          state.joined = true;
          state.joinNameInput = '';
          state.joinStatus = { type: 'ok', msg: `¡Listo! Fuiste agregado a la sala ${code}.` };
        } else {
          state.joinStatus = { type: 'err', msg: 'No se pudo agregar. Intenta de nuevo.' };
        }
        render();
      };
      nameInput.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });

      inner.appendChild(el('h2', { class: 'r-display' }, ['Únete a la ruleta']));
      inner.appendChild(el('p', { class: 'r-participant-sub' }, ['Escribe el código de la sala y tu nombre.']));
      inner.appendChild(el('div', { class: 'r-join-code-row' }, [
        el('span', { class: 'r-field-label' }, ['Código de sala']),
        codeInput
      ]));
      inner.appendChild(el('div', { class: 'r-join-code-row' }, [
        el('span', { class: 'r-field-label' }, ['Ingresa usuario']),
        nameInput
      ]));
      inner.appendChild(el('button', { class: 'r-btn r-btn-primary', style: 'width:100%; font-size:16px;', onclick: submit }, ['Unirme']));
      if (state.joinStatus) {
        inner.appendChild(el('div', { class: `r-participant-status ${state.joinStatus.type === 'ok' ? 'r-status-ok' : 'r-status-err'}` }, [state.joinStatus.msg]));
      }
    } else {
      // quick-add mode: only the username box, as requested
      const nameInput = el('input', {
        class: 'r-big-input', placeholder: 'Ingresa usuario', autofocus: 'true',
        oninput: e => state.joinNameInput = e.target.value
      });
      const submit = async () => {
        const name = state.joinNameInput.trim();
        if (!name) return;
        const ok = await addParticipant(state.code, name);
        nameInput.value = '';
        state.joinNameInput = '';
        state.joinStatus = ok
          ? { type: 'ok', msg: `"${name}" fue agregado.` }
          : { type: 'err', msg: 'No se pudo agregar. Intenta de nuevo.' };
        render();
        const freshInput = root.querySelector('.r-big-input');
        if (freshInput) freshInput.focus();
      };
      nameInput.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });

      inner.appendChild(el('div', { class: 'r-joined-badge' }, [`Sala ${state.code}`]));
      inner.appendChild(el('h2', { class: 'r-display' }, ['Ingresa usuario']));
      inner.appendChild(el('p', { class: 'r-participant-sub' }, ['Escribe un nombre y agrégalo a la ruleta.']));
      inner.appendChild(nameInput);
      inner.appendChild(el('button', { class: 'r-btn r-btn-primary', style: 'width:100%; font-size:16px;', onclick: submit }, ['Agregar']));
      if (state.joinStatus) {
        inner.appendChild(el('div', { class: `r-participant-status ${state.joinStatus.type === 'ok' ? 'r-status-ok' : 'r-status-err'}` }, [state.joinStatus.msg]));
      }
      inner.appendChild(el('button', {
        class: 'r-change-room',
        onclick: () => { state.joined = false; state.code = ''; state.joinCodeInput = ''; state.joinStatus = null; render(); }
      }, ['Unirme a otra sala']));
    }

    root.appendChild(wrap);
  }

  function stopSelfPoll() {} // participant screen doesn't poll

  function render() {
    root.innerHTML = '';
    if (state.screen === 'select') { stopPolling(); renderSelectScreen(); }
    else if (state.screen === 'host-setup') { stopPolling(); renderHostSetup(); }
    else if (state.screen === 'host-live') { renderHostLive(); }
    else if (state.screen === 'participant') { stopPolling(); renderParticipant(); }
  }

  render();
})();
</script>
