<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ruleta de Sorteos Pro | Sincronizada PC & Celular</title>
  <meta name="description" content="Ruleta de sorteos interactiva, ultra colorida y sincronizada en tiempo real entre computador y teléfono móvil.">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Canvas Confetti CDN -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  
  <!-- PeerJS for Real-Time WebRTC P2P Sync (PC & Mobile) -->
  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>

  <style>
    :root {
      --bg-dark: #080614;
      --bg-gradient: radial-gradient(circle at 50% 0%, #1e113a 0%, #0d091e 50%, #05040d 100%);
      --card-bg: rgba(24, 18, 44, 0.78);
      --card-border: rgba(255, 255, 255, 0.12);
      
      /* Vibrant Neon Color Palette */
      --neon-pink: #FF007F;
      --neon-purple: #8A2BE2;
      --neon-cyan: #00F0FF;
      --neon-yellow: #FFE600;
      --neon-green: #00FF88;
      --neon-orange: #FF5400;
      --neon-red: #FF2A55;
      
      --text-main: #FFFFFF;
      --text-muted: rgba(255, 255, 255, 0.65);
      --text-dark: #0C0A1A;
      
      --glow-pink: 0 0 25px rgba(255, 0, 127, 0.55);
      --glow-cyan: 0 0 25px rgba(0, 240, 255, 0.55);
      --glow-yellow: 0 0 25px rgba(255, 230, 0, 0.55);
      
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 22px;
      --radius-full: 9999px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-dark);
      background-image: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Ambient animated background glowing blobs */
    .bg-lights {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .bg-light-blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.25;
      animation: floatBlobs 18s ease-in-out infinite alternate;
    }
    .blob-1 { width: 500px; height: 500px; background: var(--neon-purple); top: -10%; left: 10%; }
    .blob-2 { width: 420px; height: 420px; background: var(--neon-cyan); bottom: -5%; right: 5%; animation-delay: -6s; }
    .blob-3 { width: 350px; height: 350px; background: var(--neon-pink); top: 35%; left: 65%; animation-delay: -12s; }
    @keyframes floatBlobs {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(40px, -30px) scale(1.1); }
      100% { transform: translate(-30px, 40px) scale(0.95); }
    }

    #app {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 14px 18px 36px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .font-bebas { font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.05em; }
    .gradient-text {
      background: linear-gradient(135deg, #FFE600 0%, #FF007F 50%, #00F0FF 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .gradient-cyan {
      background: linear-gradient(135deg, #00FF88 0%, #00F0FF 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Top Navigation / Status Header */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      margin-bottom: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
    }
    .logo-group {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }
    .logo-icon {
      font-size: 30px;
      filter: drop-shadow(0 0 10px rgba(255, 230, 0, 0.6));
      animation: spinPulse 8s ease-in-out infinite;
    }
    @keyframes spinPulse {
      0% { transform: rotate(0deg) scale(1); }
      50% { transform: rotate(180deg) scale(1.08); }
      100% { transform: rotate(360deg) scale(1); }
    }
    .logo-title {
      font-size: 26px;
      font-weight: 800;
      line-height: 1;
      margin: 0;
    }
    .logo-subtitle {
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Status Pill */
    .sync-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background: rgba(0, 255, 136, 0.12);
      border: 1px solid rgba(0, 255, 136, 0.35);
      border-radius: var(--radius-full);
      font-size: 12px;
      font-weight: 600;
      color: var(--neon-green);
    }
    .sync-status.offline {
      background: rgba(255, 42, 85, 0.12);
      border-color: rgba(255, 42, 85, 0.3);
      color: var(--neon-red);
    }
    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 8px currentColor;
      animation: blinkDot 1.5s infinite ease-in-out;
    }
    @keyframes blinkDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .room-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background: rgba(255, 230, 0, 0.14);
      border: 1px solid rgba(255, 230, 0, 0.45);
      border-radius: var(--radius-full);
      color: var(--neon-yellow);
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .room-badge:hover {
      background: rgba(255, 230, 0, 0.25);
      box-shadow: var(--glow-yellow);
      transform: translateY(-1px);
    }

    .icon-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
      transition: all 0.2s ease;
    }
    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.18);
      border-color: var(--neon-cyan);
      box-shadow: var(--glow-cyan);
      transform: translateY(-2px);
    }
    .icon-btn.active-stage {
      background: rgba(0, 240, 255, 0.25);
      border-color: var(--neon-cyan);
      color: var(--neon-cyan);
      box-shadow: var(--glow-cyan);
    }

    /* Buttons */
    .btn {
      font-family: inherit;
      font-weight: 700;
      font-size: 15px;
      padding: 12px 22px;
      border-radius: var(--radius-md);
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.22s cubic-bezier(0.2, 0.8, 0.2, 1);
      text-decoration: none;
    }
    .btn:active {
      transform: scale(0.96);
    }
    .btn-primary {
      background: linear-gradient(135deg, #FF007F 0%, #FF5400 100%);
      color: white;
      box-shadow: var(--glow-pink);
    }
    .btn-primary:hover {
      filter: brightness(1.15);
      box-shadow: 0 0 35px rgba(255, 0, 127, 0.8);
      transform: translateY(-2px);
    }
    .btn-cyan {
      background: linear-gradient(135deg, #00C6FF 0%, #0072FF 100%);
      color: white;
      box-shadow: var(--glow-cyan);
    }
    .btn-cyan:hover {
      filter: brightness(1.15);
      transform: translateY(-2px);
    }
    .btn-gold {
      background: linear-gradient(135deg, #FFE600 0%, #FF9900 100%);
      color: var(--text-dark);
      box-shadow: var(--glow-yellow);
    }
    .btn-gold:hover {
      filter: brightness(1.1);
      transform: translateY(-2px);
    }
    .btn-glass {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      border: 1px solid var(--card-border);
    }
    .btn-glass:hover {
      background: rgba(255, 255, 255, 0.16);
      border-color: rgba(255, 255, 255, 0.3);
    }
    .btn-danger {
      background: rgba(255, 42, 85, 0.15);
      border: 1px solid rgba(255, 42, 85, 0.35);
      color: var(--neon-red);
    }
    .btn-danger:hover {
      background: rgba(255, 42, 85, 0.3);
    }

    /* Role Selection Screen */
    .role-selection-wrapper {
      max-width: 840px;
      margin: 4vh auto;
      text-align: center;
    }
    .hero-heading {
      font-size: clamp(40px, 7vw, 70px);
      line-height: 0.95;
      margin-bottom: 12px;
    }
    .hero-sub {
      font-size: 17px;
      color: var(--text-muted);
      max-width: 600px;
      margin: 0 auto 36px;
      line-height: 1.5;
    }
    .roles-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      margin-bottom: 30px;
    }
    @media (max-width: 680px) {
      .roles-grid { grid-template-columns: 1fr; }
    }
    .role-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 2px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 34px 26px;
      text-align: left;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .role-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--neon-pink), var(--neon-cyan));
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .role-card:hover {
      transform: translateY(-6px);
      border-color: var(--neon-cyan);
      box-shadow: 0 15px 40px rgba(0, 240, 255, 0.25);
    }
    .role-card:hover::before {
      opacity: 1;
    }
    .role-card.host-card:hover {
      border-color: var(--neon-yellow);
      box-shadow: 0 15px 40px rgba(255, 230, 0, 0.25);
    }
    .role-badge-icon {
      width: 58px;
      height: 58px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      margin-bottom: 20px;
      border: 1px solid var(--card-border);
    }
    .role-card h3 {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 8px;
    }
    .role-card p {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 18px;
    }
    .role-features {
      list-style: none;
      font-size: 13.5px;
      color: rgba(255, 255, 255, 0.85);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .role-features li::before {
      content: '✓ ';
      color: var(--neon-green);
      font-weight: bold;
    }

    /* HOST / MAIN STAGE VIEW */
    .host-stage {
      display: grid;
      grid-template-columns: 1.15fr 1fr;
      gap: 26px;
      align-items: start;
      transition: all 0.3s ease;
    }
    .host-stage.expanded {
      grid-template-columns: 1fr;
      max-width: 960px;
      margin: 0 auto;
      justify-items: center;
    }
    .host-stage.expanded .panels-column {
      display: none !important;
    }
    .host-stage.expanded .wheel-outer-ring {
      width: min(92vw, 68vh, 620px);
      padding: 24px;
      box-shadow:
        0 0 0 8px rgba(255, 255, 255, 0.12),
        0 0 70px rgba(138, 43, 226, 0.7),
        0 0 120px rgba(0, 240, 255, 0.3),
        inset 0 0 45px rgba(0, 0, 0, 0.9);
      margin-bottom: 20px;
    }
    .host-stage.expanded .wheel-center-hub {
      width: 96px;
      height: 96px;
      font-size: 38px;
    }
    .host-stage.expanded .wheel-pointer {
      width: 48px;
      height: 64px;
      top: -10px;
    }
    .host-stage.expanded .spin-grand-btn {
      font-size: 36px;
      padding: 16px 64px;
    }
    @media (max-width: 960px) {
      .host-stage {
        grid-template-columns: 1fr;
      }
    }

    /* Grand Wheel Container with LED Ring */
    .wheel-stage-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .wheel-outer-ring {
      position: relative;
      width: min(100%, 390px);
      aspect-ratio: 1;
      padding: 16px;
      background: radial-gradient(circle, #271a48 0%, #130d29 80%, #080614 100%);
      border-radius: 50%;
      box-shadow:
        0 0 0 5px rgba(255, 255, 255, 0.08),
        0 0 40px rgba(138, 43, 226, 0.45),
        inset 0 0 30px rgba(0, 0, 0, 0.85);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }

    /* LED Lights around the wheel */
    .led-lights-ring {
      position: absolute;
      inset: 4px;
      border-radius: 50%;
      pointer-events: none;
    }
    .led-bulb {
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #FFE600;
      box-shadow: 0 0 10px #FFE600, 0 0 20px #FFE600;
      transform: translate(-50%, -50%);
      transition: opacity 0.15s;
    }
    .led-bulb.alt {
      background: #FF007F;
      box-shadow: 0 0 10px #FF007F, 0 0 20px #FF007F;
    }
    .led-bulb.alt2 {
      background: #00F0FF;
      box-shadow: 0 0 10px #00F0FF, 0 0 20px #00F0FF;
    }
    .led-bulb.dim {
      opacity: 0.25;
      box-shadow: none;
    }

    /* The Pointer Needle */
    .wheel-pointer {
      position: absolute;
      top: -6px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      width: 38px;
      height: 50px;
      filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.75));
      transform-origin: 50% 10px;
      transition: transform 0.07s ease-out;
      pointer-events: none;
    }
    .wheel-pointer svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    .wheel-pointer.tick {
      transform: translateX(-50%) rotate(-20deg);
    }

    /* Central Hub */
    .wheel-center-hub {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #FFFFFF 0%, #FFE600 45%, #CC9900 80%, #664400 100%);
      border: 4px solid #17112C;
      box-shadow: 
        0 0 0 3px rgba(255, 230, 0, 0.7),
        0 8px 24px rgba(0, 0, 0, 0.7),
        inset 0 2px 4px rgba(255, 255, 255, 0.85);
      z-index: 15;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      color: #0C0A1A;
      cursor: pointer;
      user-select: none;
      transition: transform 0.15s ease;
    }
    .wheel-center-hub:hover {
      transform: translate(-50%, -50%) scale(1.08);
    }

    /* High-DPI Canvas Wheel */
    .wheel-canvas-wrap {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 25px rgba(0,0,0,0.6);
    }
    #wheelCanvas {
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 50%;
    }

    /* Big Spin Trigger Button */
    .spin-grand-btn {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 28px;
      letter-spacing: 0.08em;
      padding: 13px 46px;
      border-radius: var(--radius-full);
      background: linear-gradient(135deg, #FF007F 0%, #FF5400 50%, #FFE600 100%);
      color: #FFFFFF;
      border: none;
      cursor: pointer;
      box-shadow: 0 0 30px rgba(255, 0, 127, 0.6), 0 8px 25px rgba(0,0,0,0.5);
      transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
      position: relative;
      overflow: hidden;
    }
    .spin-grand-btn::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -60%;
      width: 40%;
      height: 200%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
      transform: rotate(25deg);
      animation: btnShimmer 3s infinite;
    }
    @keyframes btnShimmer {
      0% { left: -60%; }
      30%, 100% { left: 140%; }
    }
    .spin-grand-btn:hover:not(:disabled) {
      transform: translateY(-3px) scale(1.04);
      box-shadow: 0 0 50px rgba(255, 0, 127, 0.9), 0 12px 30px rgba(0,0,0,0.6);
    }
    .spin-grand-btn:active:not(:disabled) {
      transform: translateY(1px) scale(0.98);
    }
    .spin-grand-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      filter: grayscale(0.6);
      box-shadow: none;
    }

    /* Right Control & Management Panels */
    .panels-column {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 18px 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
    }
    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .panel-title {
      font-size: 18px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .count-badge {
      background: rgba(255, 255, 255, 0.12);
      padding: 2px 10px;
      border-radius: var(--radius-full);
      font-size: 12px;
      font-weight: 700;
      color: var(--neon-cyan);
    }

    /* Inputs */
    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }
    .input-styled {
      flex: 1;
      background: rgba(12, 9, 24, 0.7);
      border: 1.5px solid var(--card-border);
      border-radius: var(--radius-md);
      padding: 12px 16px;
      color: white;
      font-family: inherit;
      font-size: 15px;
      outline: none;
      transition: all 0.2s ease;
    }
    .input-styled:focus {
      border-color: var(--neon-cyan);
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
      background: rgba(18, 14, 36, 0.9);
    }
    .input-styled::placeholder {
      color: rgba(255, 255, 255, 0.35);
    }

    /* Participants List */
    .participants-list {
      list-style: none;
      max-height: 230px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-right: 4px;
    }
    .participants-list::-webkit-scrollbar {
      width: 5px;
    }
    .participants-list::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
    }
    .participant-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: var(--radius-sm);
      transition: all 0.15s ease;
    }
    .participant-item:hover {
      background: rgba(255, 255, 255, 0.09);
      border-color: rgba(255, 255, 255, 0.15);
    }
    .p-info {
      display: flex;
      align-items: center;
      gap: 10px;
      overflow: hidden;
    }
    .p-color-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
      box-shadow: 0 0 8px currentColor;
    }
    .p-name {
      font-size: 14.5px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .p-remove {
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.35);
      cursor: pointer;
      font-size: 16px;
      padding: 2px 6px;
      border-radius: 4px;
      transition: color 0.15s, background 0.15s;
    }
    .p-remove:hover {
      color: var(--neon-red);
      background: rgba(255, 42, 85, 0.15);
    }
    .empty-placeholder {
      text-align: center;
      padding: 20px 10px;
      color: var(--text-muted);
      font-size: 13.5px;
      border: 1px dashed rgba(255, 255, 255, 0.15);
      border-radius: var(--radius-md);
    }

    /* Options / Toggles */
    .options-row {
      display: flex;

<body>

  <!-- Animated Ambient Background Glow -->
  <div class="bg-lights">
    <div class="bg-light-blob blob-1"></div>
    <div class="bg-light-blob blob-2"></div>
    <div class="bg-light-blob blob-3"></div>
  </div>

  <div id="app"></div>
  <div id="toast" class="toast-msg"></div>

  <script>
  (function() {
    'use strict';

    // --- Vibrant Rainbow Neon Color Palette ---
    const PALETTE = [
      '#FF007F', // Neon Pink
      '#00E5FF', // Electric Cyan
      '#FFD600', // Bright Gold
      '#00E676', // Emerald Green
      '#7C4DFF', // Neon Violet
      '#FF6D00', // Neon Orange
      '#2979FF', // Vivid Blue
      '#FF1744', // Ruby Crimson
      '#1DE9B6', // Seafoam Neon
      '#F50057'  // Deep Magenta
    ];

    // --- Web Audio Synthesizer ---
    class AudioEngine {
      constructor() {
        this.ctx = null;
        this.muted = localStorage.getItem('ruleta_muted') === 'true';
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            this.ctx = new AudioContext();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      toggleMute() {
        this.muted = !this.muted;
        localStorage.setItem('ruleta_muted', this.muted);
        return this.muted;
      }

      playTick(freq = 600) {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(140, this.ctx.currentTime + 0.035);
          gain.gain.setValueAtTime(0.35, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.035);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.035);
        } catch (e) {}
      }

      playWinner() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        try {
          const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
          notes.forEach((f, i) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(f, this.ctx.currentTime + i * 0.1);
            gain.gain.setValueAtTime(0, this.ctx.currentTime + i * 0.1);
            gain.gain.linearRampToValueAtTime(0.38, this.ctx.currentTime + i * 0.1 + 0.04);
            gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + i * 0.1 + 0.85);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(this.ctx.currentTime + i * 0.1);
            osc.stop(this.ctx.currentTime + i * 0.1 + 0.85);
          });
        } catch (e) {}
      }

      playClick() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(750, this.ctx.currentTime);
          gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.04);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.04);
        } catch (e) {}
      }
    }

    const audio = new AudioEngine();

    // --- Robust Multi-Layer Synchronization Manager (PeerJS WebRTC + Native WebSocket + BroadcastChannel) ---
    class SyncManager {
      constructor(roomCode, role, onMessageCallback) {
        this.roomCode = String(roomCode || '').trim();
        this.role = role || 'host'; // 'host' | 'mobile'
        this.onMessage = onMessageCallback;
        this.connected = false;
        this.clientId = 'client_' + Math.random().toString(36).substr(2, 8);
        
        this.ws = null;
        this.peer = null;
        this.peerConnections = new Map(); // connId -> DataConnection
        this.hostConn = null;
        this.broadcastChannel = null;
        this.destroyed = false;

        this.initBroadcast();
        this.initConnection();
      }

      initBroadcast() {
        if (typeof BroadcastChannel !== 'undefined') {
          try {
            this.broadcastChannel = new BroadcastChannel('ruleta_room_' + this.roomCode);
            this.broadcastChannel.onmessage = (event) => {
              if (this.onMessage && event.data && event.data.senderId !== this.clientId) {
                this.onMessage(event.data);
              }
            };
          } catch (e) {}
        }
      }

      initConnection() {
        let wsHost = window.location.host;
        if (state.serverUrl && state.serverUrl.startsWith('http')) {
          try {
            wsHost = new URL(state.serverUrl).host;
          } catch (e) {}
        }

        const isLocalHost = wsHost && (
          wsHost.includes('localhost') || 
          wsHost.includes('127.0.0.1') || 
          /^192\.168\./.test(wsHost) || 
          /^10\./.test(wsHost) || 
          /^172\.(1[6-9]|2[0-9]|3[0-1])\./.test(wsHost) ||
          wsHost.includes(':3000')
        );

        if (isLocalHost && window.location.protocol !== 'file:') {
          this.connectNativeWS(wsHost);
        } else {
          this.connectPeerJS();
        }
      }

      connectNativeWS(wsHost) {
        const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${wsProtocol}//${wsHost}`;

        try {
          this.ws = new WebSocket(wsUrl);

          this.ws.onopen = () => {
            if (this.destroyed) return;
            this.connected = true;
            this.ws.send(JSON.stringify({ action: 'JOIN_ROOM', room: this.roomCode, clientId: this.clientId }));
            triggerRender();
          };

          this.ws.onmessage = (event) => {
            try {
              const msg = JSON.parse(event.data);
              if (msg && msg.senderId !== this.clientId) {
                if (this.onMessage) this.onMessage(msg);
              }
            } catch (err) {}
          };

          this.ws.onclose = () => {
            this.connected = false;
            triggerRender();
            if (!this.destroyed && window.location.hostname !== 'localhost') {
              this.connectPeerJS();
            }
          };

          this.ws.onerror = () => {
            this.connected = false;
            if (!this.destroyed && window.location.hostname !== 'localhost') {
              this.connectPeerJS();
            }
          };
        } catch (e) {
          this.connectPeerJS();
        }
      }

      connectPeerJS() {
        if (this.peer || typeof Peer === 'undefined' || this.destroyed) return;

        const peerConfig = {
          debug: 1,
          config: {
            iceServers: [
              { urls: 'stun:stun.l.google.com:19302' },
              { urls: 'stun:global.stun.twilio.com:3478' }
            ]
          }
        };

        const hostPeerId = 'ruleta-sorteos-' + this.roomCode;

        try {
          if (this.role === 'host') {
            // Host listens on fixed peer ID
            this.peer = new Peer(hostPeerId, peerConfig);

            this.peer.on('open', (id) => {
              if (this.destroyed) return;
              this.connected = true;
              triggerRender();
            });

            this.peer.on('connection', (conn) => {
              const connId = conn.peer || conn.connectionId || Math.random().toString();
              this.peerConnections.set(connId, conn);

              conn.on('open', () => {
                this.connected = true;
                triggerRender();
                // Send current room state to newly connected mobile
                conn.send({
                  action: 'STATE_SYNC_RESPONSE',
                  data: {
                    participants: state.participants,
                    winners: state.winners,
                    removeWinnerAfterSpin: state.removeWinnerAfterSpin,
                    spinning: state.spinning
                  },
                  senderId: this.clientId,
                  room: this.roomCode
                });
                showToast('📱 Celular conectado a la sala');
              });

              conn.on('data', (data) => {
                if (this.onMessage && data && data.senderId !== this.clientId) {
                  this.onMessage(data);
                }
              });

              conn.on('close', () => {
                this.peerConnections.delete(connId);
                triggerRender();
              });

              conn.on('error', () => {
                this.peerConnections.delete(connId);
              });
            });

            this.peer.on('error', (err) => {
              if (err.type === 'unavailable-id') {
                this.connected = true;
                triggerRender();
              }
            });

          } else {
            // Mobile client connects to host peer
            this.peer = new Peer(null, peerConfig);

            this.peer.on('open', (id) => {
              if (this.destroyed) return;
              this.connectToHost(hostPeerId);
            });

            this.peer.on('error', (err) => {
              setTimeout(() => {
                if (!this.connected && !this.destroyed) this.connectToHost(hostPeerId);
              }, 2000);
            });
          }
        } catch (e) {
          console.error('PeerJS init error:', e);
        }
      }

      connectToHost(hostPeerId) {
        if (!this.peer || this.destroyed) return;
        
        try {
          this.hostConn = this.peer.connect(hostPeerId, { reliable: true });

          this.hostConn.on('open', () => {
            if (this.destroyed) return;
            this.connected = true;
            triggerRender();
            showToast('✓ Conectado a la ruleta en PC');
            this.send('STATE_SYNC_REQUEST');
          });

          this.hostConn.on('data', (data) => {
            if (this.onMessage && data && data.senderId !== this.clientId) {
              this.onMessage(data);
            }
          });

          this.hostConn.on('close', () => {
            this.connected = false;
            triggerRender();
            setTimeout(() => {
              if (!this.connected && !this.destroyed) this.connectToHost(hostPeerId);
            }, 2500);
          });

          this.hostConn.on('error', () => {
            this.connected = false;
            triggerRender();
          });
        } catch (e) {}
      }

      send(action, data = {}) {
        const payload = {
          action: action,
          data: data,
          room: this.roomCode,
          senderId: this.clientId,
          timestamp: Date.now()
        };

        // 1. BroadcastChannel (same PC tabs)
        if (this.broadcastChannel) {
          try { this.broadcastChannel.postMessage(payload); } catch (e) {}
        }

        // 2. Native WebSocket (local Wi-Fi server)
        if (this.ws && this.ws.readyState === WebSocket.OPEN) {
          try { this.ws.send(JSON.stringify(payload)); } catch (e) {}
        }

        // 3. PeerJS WebRTC DataChannel
        if (this.role === 'host') {
          for (const conn of this.peerConnections.values()) {
            if (conn && conn.open) {
              try { conn.send(payload); } catch (e) {}
            }
          }
        } else if (this.hostConn && this.hostConn.open) {
          try { this.hostConn.send(payload); } catch (e) {}
        }
      }

      destroy() {
        this.destroyed = true;
        try { if (this.ws) this.ws.close(); } catch (e) {}
        try { if (this.hostConn) this.hostConn.close(); } catch (e) {}
        try { if (this.peer) this.peer.destroy(); } catch (e) {}
        try { if (this.broadcastChannel) this.broadcastChannel.close(); } catch (e) {}
      }
    }

    // Helper to calculate exact base URL (preserves repository pathname on GitHub Pages or custom hosting)
    function getCleanBaseUrl() {
      if (typeof window === 'undefined' || !window.location) {
        return 'http://localhost:3000/';
      }
      if (window.location.protocol === 'file:') {
        return `http://${state.localIp || 'localhost'}:3000/`;
      }
      let cleanUrl = window.location.href.split('?')[0].split('#')[0];
      if (!cleanUrl.endsWith('/') && !/\.[a-zA-Z0-9]+$/.test(cleanUrl)) {
        cleanUrl += '/';
      }
      return cleanUrl;
    }

    function getMobileUrl(roomCode) {
      const room = roomCode || state.roomCode || '';
      const base = state.serverUrl || getCleanBaseUrl();
      const sep = base.includes('?') ? '&' : (base.endsWith('/') || base.endsWith('.html') ? '?' : '/?');
      return `${base}${sep}room=${room}&mode=mobile`;
    }

    // --- Global Application State ---
    const state = {
      view: 'select', // 'select' | 'host' | 'mobile'
      mobileTab: 'remote', // 'remote' | 'participants'
      roomCode: '',
      serverUrl: getCleanBaseUrl(),
      localIp: '192.168.1.36',
      participants: [
        { id: '1', name: 'Ana García' },
        { id: '2', name: 'Carlos López' },
        { id: '3', name: 'María Rodríguez' },
        { id: '4', name: 'Juan Pablo' },
        { id: '5', name: 'Valentina Soto' },
        { id: '6', name: 'Diego Morales' }
      ],
      winners: [],
      removeWinnerAfterSpin: true,
      spinning: false,
      winnerModal: null,
      batchModalOpen: false,
      qrModalOpen: false,
      showQRCard: true,
      expandedStage: false,
      sync: null,
      angle: 0 // Current rotation in radians
    };

    // Auto-detect server network IP with fast timeout
    async function fetchServerInfo() {
      if (window.location.protocol === 'http:' || window.location.protocol === 'https:') {
        if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || /^192\.168\./.test(window.location.hostname)) {
          try {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 600);
            const res = await fetch('/api/info', { signal: controller.signal });
            clearTimeout(timeoutId);
            if (res.ok) {
              const data = await res.json();
              if (data.url) state.serverUrl = data.url;
              if (data.localIp) state.localIp = data.localIp;
              return;
            }
          } catch (e) {}
          state.serverUrl = `http://${state.localIp || 'localhost'}:3000`;
          return;
        }
      }
      state.serverUrl = getCleanBaseUrl();
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      if (!toast) return;
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2800);
    }

    function generateRoomCode() {
      return String(Math.floor(1000 + Math.random() * 9000));
    }

    function initSync(code, role) {
      if (state.sync) {
        state.sync.destroy();
      }
      state.sync = new SyncManager(code, role || state.view, handleRemoteMessage);
    }

    function handleRemoteMessage(msg) {
      if (!msg || !msg.action) return;

      switch (msg.action) {
        case 'ADD_PARTICIPANT':
          if (msg.data && msg.data.name) {
            const clean = msg.data.name.trim();
            if (clean && !state.participants.some(p => p.name.toLowerCase() === clean.toLowerCase())) {
              state.participants.push({
                id: Date.now() + '_' + Math.random().toString(36).substr(2, 4),
                name: clean
              });
              showToast(`📱 + "${clean}" agregado a la ruleta`);
              audio.playClick();
              triggerRender();
              if (state.view === 'host' && state.sync) {
                state.sync.send('STATE_SYNC_RESPONSE', {
                  participants: state.participants,
                  winners: state.winners,
                  removeWinnerAfterSpin: state.removeWinnerAfterSpin,
                  spinning: state.spinning
                });
              }
            }
          }
          break;

        case 'ADD_BATCH':
          if (Array.isArray(msg.data.names) && msg.data.names.length) {
            let count = 0;
            msg.data.names.forEach(n => {
              const clean = n.trim();
              if (clean && !state.participants.some(p => p.name.toLowerCase() === clean.toLowerCase())) {
                state.participants.push({
                  id: Date.now() + '_' + Math.random().toString(36).substr(2, 4),
                  name: clean
                });
                count++;
              }
            });
            if (count > 0) {
              showToast(`📱 + ${count} participantes agregados`);
              audio.playClick();
              triggerRender();
              if (state.view === 'host' && state.sync) {
                state.sync.send('STATE_SYNC_RESPONSE', {
                  participants: state.participants,
                  winners: state.winners,
                  removeWinnerAfterSpin: state.removeWinnerAfterSpin,
                  spinning: state.spinning
                });
              }
            }
          }
          break;

        case 'REMOVE_PARTICIPANT':
          if (msg.data && msg.data.id) {
            state.participants = state.participants.filter(p => p.id !== msg.data.id);
            audio.playClick();
            triggerRender();
            if (state.view === 'host' && state.sync) {
              state.sync.send('STATE_SYNC_RESPONSE', {
                participants: state.participants,
                winners: state.winners,
                removeWinnerAfterSpin: state.removeWinnerAfterSpin,
                spinning: state.spinning
              });
            }
          }
          break;

        case 'TRIGGER_SPIN':
          if (state.view === 'host') {
            if (!state.spinning && state.participants.length >= 2) {
              executeSpin(msg.data?.targetWinnerIndex, msg.data?.extraRotations);
            }
          }
          break;

        case 'SPIN_STARTED':
          state.spinning = true;
          audio.init();
          triggerRender();
          break;

        case 'STATE_SYNC_REQUEST':
          if (state.view === 'host' && state.sync) {
            state.sync.send('STATE_SYNC_RESPONSE', {
              participants: state.participants,
              winners: state.winners,
              removeWinnerAfterSpin: state.removeWinnerAfterSpin,
              spinning: state.spinning
            });
          }
          break;

        case 'STATE_SYNC_RESPONSE':
          if (msg.data) {
            if (Array.isArray(msg.data.participants)) state.participants = msg.data.participants;
            if (Array.isArray(msg.data.winners)) state.winners = msg.data.winners;
            if (typeof msg.data.removeWinnerAfterSpin === 'boolean') state.removeWinnerAfterSpin = msg.data.removeWinnerAfterSpin;
            state.spinning = !!msg.data.spinning;
            triggerRender();
          }
          break;

        case 'WINNER_ANNOUNCED':
          if (msg.data && msg.data.winner) {
            state.winnerModal = msg.data.winner;
            if (!state.winners.some(w => w.name === msg.data.winner.name && w.time === msg.data.winner.time)) {
              state.winners.unshift(msg.data.winner);
            }
            if (Array.isArray(msg.data.participants)) {
              state.participants = msg.data.participants;
            } else if (state.removeWinnerAfterSpin) {
              state.participants = state.participants.filter(p => p.name !== msg.data.winner.name);
            }
            state.spinning = false;
            triggerConfetti();
            audio.playWinner();
            if ('vibrate' in navigator) navigator.vibrate([150, 80, 250, 100, 400]);
            triggerRender();
          }
          break;
      }
    }

    // --- Celebratory Confetti ---
    function triggerConfetti() {
      if (typeof confetti === 'function') {
        const count = 200;
        const defaults = { origin: { y: 0.7 } };
        function fire(particleRatio, opts) {
          confetti({
            ...defaults,
            ...opts,
            particleCount: Math.floor(count * particleRatio)
          });
        }
        fire(0.25, { spread: 26, startVelocity: 55 });
        fire(0.2, { spread: 60 });
        fire(0.35, { spread: 100, decay: 0.91, scalar: 0.8 });
        fire(0.1, { spread: 120, startVelocity: 25, decay: 0.92, scalar: 1.2 });
        fire(0.1, { spread: 120, startVelocity: 45 });
      }
    }

    // --- Perimeter LED Bulbs Generator ---
    function generateLedBulbs() {
      const count = 28;
      let html = '';
      for (let i = 0; i < count; i++) {
        const angle = (i * 360) / count;
        const rad = (angle * Math.PI) / 180;
        const x = 50 + 48.5 * Math.sin(rad);
        const y = 50 - 48.5 * Math.cos(rad);
        const altClass = i % 3 === 0 ? 'alt' : i % 3 === 1 ? 'alt2' : '';
        html += `<div class="led-bulb ${altClass}" style="left:${x}%; top:${y}%;"></div>`;
      }
      return html;
    }

    // --- HIGH-PRECISION 2D CANVAS WHEEL RENDERER (Crisp & 100% Distortion-Free) ---
    function drawWheel() {
      const canvas = document.getElementById('wheelCanvas');
      if (!canvas) return;

      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      const size = Math.min(rect.width || 380, rect.height || 380);
      
      canvas.width = size * dpr;
      canvas.height = size * dpr;

      const ctx = canvas.getContext('2d');
      ctx.scale(dpr, dpr);

      const cx = size / 2;
      const cy = size / 2;
      const radius = size / 2 - 4;
      const participants = state.participants;
      const n = participants.length;

      ctx.clearRect(0, 0, size, size);

      if (n === 0) {
        ctx.beginPath();
        ctx.arc(cx, cy, radius, 0, Math.PI * 2);
        ctx.fillStyle = '#16102D';
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.15)';
        ctx.lineWidth = 3;
        ctx.stroke();

        ctx.fillStyle = 'rgba(255,255,255,0.5)';
        ctx.font = 'bold 15px "Outfit", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('Agrega participantes para comenzar', cx, cy);
        return;
      }

      const sliceAngle = (Math.PI * 2) / n;

      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(state.angle);

      for (let i = 0; i < n; i++) {
        const startA = i * sliceAngle;
        const endA = startA + sliceAngle;
        const color = PALETTE[i % PALETTE.length];

        // Draw Sector
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.arc(0, 0, radius, startA, endA);
        ctx.closePath();

        const grad = ctx.createRadialGradient(0, 0, radius * 0.2, 0, 0, radius);
        grad.addColorStop(0, color);
        grad.addColorStop(1, adjustColorBrightness(color, -25));
        ctx.fillStyle = grad;
        ctx.fill();

        // Sector Divider Border
        ctx.strokeStyle = '#080614';
        ctx.lineWidth = 2.5;
        ctx.stroke();

        // Sector Pin/Peg on Outer Rim
        const pinRadius = size > 480 ? 5 : 3.5;
        const pinInset = size > 480 ? 8 : 5;
        const pinX = Math.cos(startA) * (radius - pinInset);
        const pinY = Math.sin(startA) * (radius - pinInset);
        ctx.beginPath();
        ctx.arc(pinX, pinY, pinRadius, 0, Math.PI * 2);
        ctx.fillStyle = '#FFE600';
        ctx.fill();
        ctx.strokeStyle = '#332600';
        ctx.lineWidth = size > 480 ? 1.5 : 1;
        ctx.stroke();

        // Text Label Along the Sector Spoke
        const midA = startA + sliceAngle / 2;
        ctx.save();
        ctx.rotate(midA);
        ctx.textAlign = 'right';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = '#FFFFFF';
        ctx.shadowColor = 'rgba(0, 0, 0, 0.85)';
        ctx.shadowBlur = size > 480 ? 6 : 4;
        ctx.shadowOffsetX = 1;
        ctx.shadowOffsetY = 1;

        const fontSize = size > 480
          ? (n > 24 ? 14 : n > 14 ? 18 : n > 8 ? 22 : 26)
          : (n > 24 ? 11 : n > 14 ? 13 : n > 8 ? 15 : 17);
        ctx.font = `800 ${fontSize}px "Outfit", sans-serif`;

        let label = participants[i].name;
        const maxLen = size > 480 ? (n > 20 ? 14 : 22) : (n > 20 ? 10 : 16);
        if (label.length > maxLen) label = label.slice(0, maxLen - 1) + '…';

        ctx.fillText(label, radius - (size > 480 ? 30 : 20), 0);
        ctx.restore();
      }

      ctx.restore();
    }

    function adjustColorBrightness(hex, percent) {
      let num = parseInt(hex.replace('#', ''), 16);
      let r = (num >> 16) + percent;
      let g = ((num >> 8) & 0x00FF) + percent;
      let b = (num & 0x0000FF) + percent;
      r = Math.min(255, Math.max(0, r));
      g = Math.min(255, Math.max(0, g));
      b = Math.min(255, Math.max(0, b));
      return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
    }

    // --- SPIN PHYSICS & ANIMATION ENGINE ---
    function executeSpin(predefinedWinnerIdx = null, predefinedExtra = null) {
      if (state.spinning || state.participants.length < 2) return;
      
      state.spinning = true;
      audio.init();
      triggerRender();

      const n = state.participants.length;
      const sliceAngle = (Math.PI * 2) / n;
      const winnerIndex = (predefinedWinnerIdx !== null && predefinedWinnerIdx >= 0 && predefinedWinnerIdx < n)
        ? predefinedWinnerIdx
        : Math.floor(Math.random() * n);
      const winner = state.participants[winnerIndex];

      const extraRotations = predefinedExtra || (6 + Math.floor(Math.random() * 3));
      
      const targetSectorMid = winnerIndex * sliceAngle + sliceAngle / 2;
      const jitter = (Math.random() - 0.5) * (sliceAngle * 0.65);
      const desiredFinalTopAngle = targetSectorMid + jitter;
      
      const twoPi = Math.PI * 2;
      const currentNorm = ((state.angle % twoPi) + twoPi) % twoPi;
      const neededLanding = ((3 * Math.PI / 2 - desiredFinalTopAngle) % twoPi + twoPi) % twoPi;
      let deltaAngle = (neededLanding - currentNorm + twoPi) % twoPi;
      if (deltaAngle < Math.PI) deltaAngle += twoPi;

      const startAngle = state.angle;
      const totalDelta = extraRotations * twoPi + deltaAngle;

      const duration = 5400; // ms
      const startTime = performance.now();

      if (state.sync) {
        state.sync.send('SPIN_STARTED', {});
      }

      let lastPegIndex = -1;
      const pointerEl = document.getElementById('wheelPointer');

      function animate(now) {
        const elapsed = now - startTime;
        const progress = Math.min(elapsed / duration, 1);
        
        const ease = 1 - Math.pow(1 - progress, 4.2);
        state.angle = startAngle + totalDelta * ease;

        drawWheel();

        // Calculate passing sector pins for sound tick & needle wobble
        const currentTopRel = ((3 * Math.PI / 2 - state.angle) % twoPi + twoPi) % twoPi;
        const currentPeg = Math.floor(currentTopRel / sliceAngle);
        if (currentPeg !== lastPegIndex) {
          lastPegIndex = currentPeg;
          const speedRatio = 1 - progress;
          audio.playTick(420 + speedRatio * 380);
          if (pointerEl) {
            pointerEl.classList.add('tick');
            setTimeout(() => pointerEl && pointerEl.classList.remove('tick'), 45);
          }
        }

        // Cycle LED Lights during spin
        const bulbs = document.querySelectorAll('.led-bulb');
        if (bulbs.length) {
          const shift = Math.floor(elapsed / 70) % bulbs.length;
          bulbs.forEach((b, idx) => {
            if ((idx + shift) % 2 === 0) b.classList.add('dim');
            else b.classList.remove('dim');
          });
        }

        if (progress < 1) {
          requestAnimationFrame(animate);
        } else {
          // Spin Complete!
          state.spinning = false;
          const winnerPayload = {
            name: winner.name,
            time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
          };
          state.winnerModal = winnerPayload;
          state.winners.unshift(winnerPayload);
          
          if (state.removeWinnerAfterSpin) {
            state.participants = state.participants.filter(p => p.id !== winner.id);
          }

          if (state.sync) {
            state.sync.send('WINNER_ANNOUNCED', {
              winner: winnerPayload,
              participants: state.participants,
              winners: state.winners
            });
          }

          triggerConfetti();
          audio.playWinner();
          if ('vibrate' in navigator) navigator.vibrate([150, 80, 250, 100, 400]);
          triggerRender();
        }
      }

      requestAnimationFrame(animate);
    }

                    <h4>📱 Sincronizar Celular</h4>
                    <p>Escanea para anotar nombres o controlar el giro:</p>
                    <div class="qr-link-badge" onclick="window.ruletaActions.copyRoomLink('${mobileUrl}')" title="Clic para copiar enlace">
                      ${mobileUrl}
                    </div>
                    <div style="display:flex; align-items:baseline; gap:8px; margin-top:6px;">
                      <span style="font-size:12px; color:var(--text-muted);">Código de Sala:</span>
                      <span class="room-code-display">${state.roomCode}</span>
                    </div>
                  </div>
                </div>
              </div>
            ` : `
              <div class="qr-card-hidden-bar">
                <div style="display:flex; align-items:center; gap:8px;">
                  <span style="font-size:16px;">🔒</span>
                  <span><strong>Código QR Oculto</strong> (Protegido del público)</span>
                </div>
                <button class="btn btn-glass" style="padding:6px 14px; font-size:12px;" onclick="window.ruletaActions.toggleQRCard()">
                  👁️ Mostrar QR
                </button>
              </div>
            `}

            <!-- Participants Panel -->
            <div class="glass-card">
              <div class="panel-header">
                <div class="panel-title">
                  <span>Participantes</span>
                  <span class="count-badge">${state.participants.length}</span>
                </div>
                <div style="display:flex; gap:6px;">
                  <button class="btn btn-glass" style="padding:6px 12px; font-size:12px;" onclick="window.ruletaActions.openBatchModal()">
                    📋 Pegar Lista
                  </button>
                  <button class="btn btn-glass" style="padding:6px 12px; font-size:12px;" onclick="window.ruletaActions.loadPresetMenu()">
                    ⚡ Muestra
                  </button>
                </div>
              </div>

              <form onsubmit="event.preventDefault(); window.ruletaActions.submitAddParticipant(this.participantName.value); this.reset();" class="input-row">
                <input type="text" name="participantName" class="input-styled" placeholder="Escribe un nombre y presiona Enter..." autocomplete="off" />
                <button type="submit" class="btn btn-primary" style="padding:10px 18px;">Agregar</button>
              </form>

              <ul class="participants-list">
                ${state.participants.length ? state.participants.map((p, idx) => `
                  <li class="participant-item">
                    <div class="p-info">
                      <span class="p-color-dot" style="background:${PALETTE[idx % PALETTE.length]}; color:${PALETTE[idx % PALETTE.length]}"></span>
                      <span class="p-name">${p.name}</span>
                    </div>
                    <button class="p-remove" onclick="window.ruletaActions.removeParticipant('${p.id}')" title="Eliminar">✕</button>
                  </li>
                `).join('') : `
                  <div class="empty-placeholder">
                    Aún no hay participantes en la ruleta.<br>Agrega nombres arriba o escanea el QR desde tu celular.
                  </div>
                `}
              </ul>

              <!-- Options / Checkboxes -->
              <div class="options-row">
                <label class="toggle-label">
                  <input type="checkbox" style="display:none;" ${state.removeWinnerAfterSpin ? 'checked' : ''} onchange="window.ruletaActions.toggleRemoveWinner(this.checked)" />
                  <div class="toggle-switch"></div>
                  <span>Eliminar ganador tras el giro</span>
                </label>

                ${state.participants.length ? `
                  <button class="btn-danger" style="background:none; border:none; font-size:12px; cursor:pointer; text-decoration:underline;" onclick="window.ruletaActions.clearParticipants()">
                    Vaciar lista
                  </button>
                ` : ''}
              </div>
            </div>

            <!-- Winners History Panel -->
            ${state.winners.length ? `
              <div class="glass-card winners-card">
                <div class="panel-header">
                  <div class="panel-title" style="color:var(--neon-yellow);">
                    <span>🏆 Ganadores del Sorteo</span>
                    <span class="count-badge" style="background:rgba(255,230,0,0.15); color:var(--neon-yellow);">${state.winners.length}</span>
                  </div>
                  <button class="btn-glass" style="padding:4px 10px; font-size:11px;" onclick="window.ruletaActions.clearWinners()">
                    Limpiar
                  </button>
                </div>
                <ul class="winners-list">
                  ${state.winners.map((w, idx) => `
                    <li class="winner-entry">
                      <span>${idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : '🎖️'} ${w.name}</span>
                      <span style="font-size:11px; opacity:0.75;">${w.time}</span>
                    </li>
                  `).join('')}
                </ul>
              </div>
            ` : ''}

          </div>
        </div>
      `;
    }

    function renderMobileScreen() {
      return `
        ${renderHeader()}

        <div class="mobile-view-wrap">
          
          <!-- Tab Navigation -->
          <div class="mobile-tabs">
            <button class="tab-btn ${state.mobileTab === 'remote' ? 'active' : ''}" onclick="window.ruletaActions.setMobileTab('remote')">
              🎮 Control Remoto
            </button>
            <button class="tab-btn ${state.mobileTab === 'participants' ? 'active' : ''}" onclick="window.ruletaActions.setMobileTab('participants')">
              👥 Participantes (${state.participants.length})
            </button>
          </div>

          ${state.mobileTab === 'remote' ? `
            <!-- Remote Control Tab -->
            <div class="glass-card remote-spin-box">
              <span style="font-size:13px; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.1em; font-weight:700;">
                Sorteo en Pantalla
              </span>

              <button class="remote-spin-btn" ${state.spinning || state.participants.length < 2 ? 'disabled' : ''} onclick="window.ruletaActions.spin()">
                <span>${state.spinning ? '🌀' : '⚡'}</span>
                <span>${state.spinning ? 'GIRANDO' : '¡GIRAR!'}</span>
              </button>

              <div class="remote-status-text">
                ${state.spinning ? '¡La ruleta está girando en vivo!' : state.participants.length < 2 ? 'Agrega al menos 2 participantes' : `Listo para girar (${state.participants.length} en la ruleta)`}
              </div>

              ${state.winners.length ? `
                <div style="margin-top:24px; width:100%; text-align:left;">
                  <span style="font-size:12px; color:var(--neon-yellow); font-weight:700; display:block; margin-bottom:8px;">Último Ganador:</span>
                  <div class="winner-entry">
                    <span>🏆 ${state.winners[0].name}</span>
                    <span style="font-size:12px;">${state.winners[0].time}</span>
                  </div>
                </div>
              ` : ''}
            </div>
          ` : `
            <!-- Mobile Participants Management Tab -->
            <div class="glass-card">
              <div class="panel-header">
                <div class="panel-title">
                  <span>Agregar a la Ruleta</span>
                </div>
                <button class="btn btn-glass" style="padding:6px 12px; font-size:12px;" onclick="window.ruletaActions.openBatchModal()">
                  📋 Pegar Lista
                </button>
              </div>

              <form onsubmit="event.preventDefault(); window.ruletaActions.submitAddParticipant(this.mobPName.value); this.reset();" class="input-row">
                <input type="text" name="mobPName" class="input-styled" placeholder="Escribe tu nombre..." autocomplete="off" autofocus />
                <button type="submit" class="btn btn-primary" style="padding:10px 18px;">Agregar</button>
              </form>

              <div class="panel-title" style="margin: 18px 0 10px; font-size:15px;">
                <span>En la Ruleta (${state.participants.length})</span>
              </div>

              <ul class="participants-list" style="max-height: 320px;">
                ${state.participants.length ? state.participants.map((p, idx) => `
                  <li class="participant-item">
                    <div class="p-info">
                      <span class="p-color-dot" style="background:${PALETTE[idx % PALETTE.length]}; color:${PALETTE[idx % PALETTE.length]}"></span>
                      <span class="p-name">${p.name}</span>
                    </div>
                    <button class="p-remove" onclick="window.ruletaActions.removeParticipant('${p.id}')" title="Eliminar">✕</button>
                  </li>
                `).join('') : `
                  <div class="empty-placeholder">
                    No hay participantes aún.<br>Sé el primero en agregar tu nombre.
                  </div>
                `}
              </ul>
            </div>
          `}
        </div>
      `;
    }

    function renderWinnerModal() {
      if (!state.winnerModal) return '';
      return `
        <div class="modal-overlay" onclick="if(event.target === this) window.ruletaActions.closeWinnerModal()">
          <div class="modal-card">
            <div class="trophy-badge">🏆</div>
            <div class="winner-title">¡Tenemos un Ganador!</div>
            <div class="winner-name-highlight">${state.winnerModal.name}</div>
            <button class="btn btn-gold" style="width:100%; font-size:17px;" onclick="window.ruletaActions.closeWinnerModal()">
              ¡Continuar!
            </button>
          </div>
        </div>
      `;
    }

    function renderBatchModal() {
      if (!state.batchModalOpen) return '';
      return `
        <div class="modal-overlay" onclick="if(event.target === this) window.ruletaActions.closeBatchModal()">
          <div class="modal-card" style="text-align:left;">
            <div class="panel-title" style="margin-bottom:12px;">
              <span>📋 Pegar Lista de Participantes</span>
            </div>
            <p style="font-size:13px; color:var(--text-muted); margin-bottom:14px;">
              Pega nombres separados por saltos de línea, comas o desde Excel / WhatsApp.
            </p>
            <textarea id="batchTextInput" class="textarea-styled" placeholder="Ana García&#10;Carlos López&#10;María Rodríguez&#10;Juan Pablo..."></textarea>
            <div style="display:flex; justify-content:flex-end; gap:10px;">
              <button class="btn btn-glass" onclick="window.ruletaActions.closeBatchModal()">Cancelar</button>
              <button class="btn btn-primary" onclick="window.ruletaActions.submitBatch(document.getElementById('batchTextInput').value)">Importar Lista</button>
            </div>
          </div>
        </div>
      `;
    }

    function renderQRModal() {
      if (!state.qrModalOpen) return '';
      const mobileUrl = getMobileUrl(state.roomCode);
      const qrApiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=260x260&margin=8&data=${encodeURIComponent(mobileUrl)}`;

      return `
        <div class="modal-overlay" onclick="if(event.target === this) window.ruletaActions.toggleQRModal()">
          <div class="modal-card">
            <h3 class="panel-title" style="justify-content:center; margin-bottom:8px; font-size:20px;">
              <span>📱 Conectar Teléfono Celular</span>
            </h3>
            <p style="font-size:13px; color:var(--text-muted); margin-bottom:14px;">
              Abre la cámara de tu celular o el navegador y conéctate a la misma red Wi-Fi:
            </p>
            <div style="background:white; padding:12px; border-radius:16px; display:inline-block; margin-bottom:14px;">
              <img src="${qrApiUrl}" style="width:200px; height:200px; display:block;" alt="Código QR" />
            </div>
            
            <div style="background:rgba(255,255,255,0.06); padding:10px; border-radius:10px; margin-bottom:14px; border:1px solid var(--card-border);">
              <span style="font-size:12px; color:var(--text-muted); display:block;">Enlace directo para tu celular:</span>
              <span style="font-size:14px; font-weight:700; color:var(--neon-cyan); word-break:break-all;">${mobileUrl}</span>
            </div>

            <div style="margin-bottom:18px;">
              <span style="font-size:13px; color:var(--text-muted); display:block;">Código de Sala:</span>
              <span class="room-code-display" style="font-size:36px;">${state.roomCode}</span>
            </div>
            <div style="display:flex; gap:10px;">
              <button class="btn btn-glass" style="flex:1;" onclick="window.ruletaActions.copyRoomLink('${mobileUrl}')">
                🔗 Copiar Enlace
              </button>
              <button class="btn btn-primary" style="flex:1;" onclick="window.ruletaActions.toggleQRModal()">
                Cerrar
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function triggerRender() {
      let content = '';
      if (state.view === 'select') {
        content = renderSelectScreen();
      } else if (state.view === 'host') {
        content = renderHostScreen();
      } else if (state.view === 'mobile') {
        content = renderMobileScreen();
      }

      content += renderWinnerModal();
      content += renderBatchModal();
      content += renderQRModal();

      appEl.innerHTML = content;

      if (state.view === 'host') {
        requestAnimationFrame(drawWheel);
      }
    }

    // --- Global Actions for Event Binding ---
    window.ruletaActions = {
      setRole: (role) => {
        state.view = role;
        audio.playClick();
        triggerRender();
      },

      startHost: () => {
        if (!state.roomCode) state.roomCode = generateRoomCode();
        state.view = 'host';
        initSync(state.roomCode, 'host');
        audio.playClick();
        triggerRender();
      },

      startMobile: () => {
        const urlParams = new URLSearchParams(window.location.search);
        let room = urlParams.get('room');
        if (!room) {
          room = prompt('Ingresa el Código de Sala (ej: 7842):', state.roomCode || '');
        }
        if (room && room.trim()) {
          state.roomCode = room.trim();
          state.view = 'mobile';
          initSync(state.roomCode, 'mobile');
          audio.playClick();
          triggerRender();
        }
      },

      setMobileTab: (tab) => {
        state.mobileTab = tab;
        audio.playClick();
        triggerRender();
      },

      toggleAudio: () => {
        audio.toggleMute();
        triggerRender();
      },

      toggleFullscreen: () => {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
        } else {
          document.exitFullscreen().catch(() => {});
        }
      },

      toggleQRCard: () => {
        state.showQRCard = !state.showQRCard;
        audio.playClick();
        triggerRender();
        if (state.view === 'host') {
          setTimeout(drawWheel, 60);
        }
      },

      toggleExpandStage: () => {
        state.expandedStage = !state.expandedStage;
        if (state.expandedStage) {
          if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(() => {});
          }
        } else {
          if (document.fullscreenElement) {
            document.exitFullscreen().catch(() => {});
          }
        }
        audio.playClick();
        triggerRender();
        setTimeout(() => {
          drawWheel();
        }, 80);
      },

      toggleQRModal: () => {
        state.qrModalOpen = !state.qrModalOpen;
        audio.playClick();
        triggerRender();
      },

      copyRoomLink: (url) => {
        if (navigator.clipboard) {
          navigator.clipboard.writeText(url);
          showToast('✓ Enlace copiado al portapapeles');
        }
      },

      openBatchModal: () => {
        state.batchModalOpen = true;
        audio.playClick();
        triggerRender();
      },

      closeBatchModal: () => {
        state.batchModalOpen = false;
        triggerRender();
      },

      submitBatch: (text) => {
        parseBatchText(text);
      },

      loadPresetMenu: () => {
        const choice = confirm('¿Cargar nombres de muestra? (Aceptar para Nombres, Cancelar para Números 1-10)');
        if (choice) loadPreset('sample');
        else loadPreset('numbers');
      },

      submitAddParticipant: (name) => {
        addSingleParticipant(name);
      },

      removeParticipant: (id) => {
        removeParticipant(id);
      },

      clearParticipants: () => {
        if (confirm('¿Deseas vaciar la lista de participantes?')) {
          state.participants = [];
          if (state.sync) {
            state.sync.send('STATE_SYNC_RESPONSE', {
              participants: [],
              winners: state.winners,
              removeWinnerAfterSpin: state.removeWinnerAfterSpin
            });
          }
          triggerRender();
        }
      },

      clearWinners: () => {
        state.winners = [];
        triggerRender();
      },

      toggleRemoveWinner: (checked) => {
        state.removeWinnerAfterSpin = checked;
        if (state.sync) {
          state.sync.send('STATE_SYNC_RESPONSE', {
            participants: state.participants,
            winners: state.winners,
            removeWinnerAfterSpin: state.removeWinnerAfterSpin
          });
        }
      },

      spin: () => {
        if (state.view === 'mobile') {
          if (state.spinning || state.participants.length < 2) return;
          state.spinning = true;
          audio.playClick();
          triggerRender();
          if (state.sync) {
            state.sync.send('TRIGGER_SPIN', {});
          }
        } else {
          executeSpin();
        }
      },

      closeWinnerModal: () => {
        state.winnerModal = null;
        triggerRender();
      }
    };

    // --- Window Resize and Fullscreen Listeners for Canvas ---
    window.addEventListener('resize', () => {
      if (state.view === 'host') {
        drawWheel();
      }
    });

    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement && state.expandedStage) {
        state.expandedStage = false;
        triggerRender();
      }
      if (state.view === 'host') {
        setTimeout(drawWheel, 100);
      }
    });

    // --- URL Query Parameter Auto-Join Detection (for QR Scans) ---
    async function checkUrlAutoJoin() {
      await fetchServerInfo();

      const urlParams = new URLSearchParams(window.location.search);
      const roomParam = urlParams.get('room');
      const modeParam = urlParams.get('mode');

      if (roomParam) {
        state.roomCode = roomParam.trim();
        const role = (modeParam === 'mobile' || /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent)) ? 'mobile' : 'host';
        state.view = role;
        initSync(state.roomCode, role);
      }
      triggerRender();
    }

    // Initialize App
    checkUrlAutoJoin();

  })();
  </script>
</body>
</html>
